                const title = `${getWeatherIcon(data.current.weather_code)} ${city}`;
                new Notification(title, { 
                    body: `${Math.round(data.current.temperature_2m)}°C - ${getWeatherDesc(data.current.weather_code)}\nHissedilen: ${Math.round(data.current.feels_like)}°C`,
                    icon: './logo.png'
                });
            }
        }

        // ── CANLI SAAT ──
        function startClock() {
            function tick() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2,'0');
                const m = String(now.getMinutes()).padStart(2,'0');
                const s = String(now.getSeconds()).padStart(2,'0');
                const el = document.getElementById('clockText');
                if (el) el.textContent = `${h}:${m}:${s}`;
            }
            tick();
            setInterval(tick, 1000);
        }
        startClock();

        // ── GÜNÜN ÖNERİSİ ──
        function getTipCard(code, temp, wind) {
            let emoji, label, body;
            if (code >= 95) {
                emoji = '⛈️'; label = 'Fırtına Uyarısı';
                body = 'Güçlü gök gürültülü sağanak bekleniyor. Şemsiyenizi ve yağmurluk giysilerinizi yanınıza alın, mümkünse dışarı çıkmayın.';
            } else if (code >= 80) {
                emoji = '🌧️'; label = 'Yağışlı Hava';
                body = 'Bugün yoğun yağış var. Şemsiye şart! Araç kullanıyorsanız yavaş gidin, yol kayganlığına dikkat edin.';
            } else if (code >= 70) {
                emoji = '❄️'; label = 'Karlı Hava';
                body = 'Kar yağışı bekleniyor. Sıcak giyin; eldiven, bere ve kalorifer görevi gören bot şart. Trafikte mesafeyi açın.';
            } else if (code >= 60) {
                emoji = '☂️'; label = 'Yağmur Var';
                body = 'Hafif yağmur bekleniyor. Şemsiye ve su geçirmez ayakkabı işe yarar. İnce yağmur anlık kaybolabilir.';
            } else if (code >= 45) {
                emoji = '🌫️'; label = 'Sis ve Pus';
                body = 'Görüş mesafesi düşük. Araç sürerken sis farlarını yakın, hızı kesin düşürün.';
            } else if (temp >= 35) {
                emoji = '🥵'; label = 'Bunaltıcı Sıcaklık';
                body = 'Hava çok sıcak! Bol su için, açık renkli bol giysiler giyin, öğlen 11-16 arasında doğrudan güneşten uzak durun.';
            } else if (temp >= 28) {
                emoji = '😎'; label = 'Sıcak ve Güneşli';
                body = 'Güneş kremi sürmeyi unutmayın, güneş gözlüğü takın. Spor yapıyorsanız erken saatleri tercih edin.';
            } else if (temp <= 0) {
                emoji = '🥶'; label = 'Dondurucu Soğuk';
                body = 'Sıfırın altında! Birkaç kat giyin, özellikle baş, boyun ve ellerinizi koruyun. Boru donması ihtimaline karşı ön alın.';
            } else if (temp <= 10) {
                emoji = '🧥'; label = 'Soğuk Hava';
                body = 'Dışarıda montunuzu giyin. Katmanlı giyinmek sıcak tutar. Özellikle sabah/akşam soğuk hissedilebilir.';
            } else if (wind > 40) {
                emoji = '💨'; label = 'Rüzgarlı Hava';
                body = 'Kuvvetli rüzgar var. Şemsiye ters dönebilir, deniz ve göl kıyılarında dikkatli olun.';
            } else {
                emoji = '🌤️'; label = 'Güzel Bir Gün';
                body = 'Hava oldukça hoş. Yürüyüş, bisiklet veya açık hava aktiviteleri için ideal bir gün!';
            }
            return `<div class="tip-card"><span class="tip-emoji">${emoji}</span><div class="tip-text"><span class="tip-label">💡 Günün Önerisi — ${label}</span><span class="tip-body">${body}</span></div></div>`;
        }

        // ── BÖLGE FİLTRE CHİPLERİ ──
        document.getElementById('bolgeFilterBar').addEventListener('click', (e) => {
            const chip = e.target.closest('.bolge-filter-chip');
            if (!chip) return;
            document.querySelectorAll('.bolge-filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            const regionIdx = chip.dataset.region;
            document.querySelectorAll('.bolge-region').forEach((el, i) => {
                el.style.display = (regionIdx === 'all' || String(i) === regionIdx) ? '' : 'none';
            });
        });

        // ── HAVA KARŞILAŞTIRMA (son şehir) ──
        function saveLastWeather(city, temp, desc) {
            try {
                const prev = JSON.parse(localStorage.getItem('mugol-last-weather') || 'null');
                localStorage.setItem('mugol-last-weather', JSON.stringify({ city, temp, desc, time: Date.now() }));
                return prev;
            } catch { return null; }
        }

        function getCompareChip(city, temp) {
            try {
                const prev = JSON.parse(localStorage.getItem('mugol-last-weather') || 'null');
                if (!prev || prev.city !== city || Math.abs(Date.now() - prev.time) > 3600000 * 6) return '';
                const diff = Math.round(temp - prev.temp);
                if (diff === 0) return '';
                const arrow = diff > 0 ? '↑' : '↓';
                const color = diff > 0 ? '#f97316' : '#38bdf8';
                return `<span style="display:inline-flex;align-items:center;gap:3px;font-size:0.75rem;font-weight:800;color:${color};background:${color}18;border:1px solid ${color}40;border-radius:100px;padding:2px 9px;margin-left:8px;">${arrow} ${Math.abs(diff)}° değişti</span>`;
            } catch { return ''; }
        }

        // ── PAYLAŞ BUTONU ──
        function shareWeather(city, temp, desc) {
            const text = `📍 ${city} — ${temp}°C, ${desc}\nMuGöl Hava Durumu ile bakıldı 🌤️\nhttps://mugol-portal.github.io`;
            if (navigator.share) {
                navigator.share({ title: 'MuGöl Hava Durumu', text });
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('📋 Panoya kopyalandı!');
                });
            }
        }

        function showToast(msg) {
            let t = document.getElementById('mugolToast');
            if (!t) { t = document.createElement('div'); t.id = 'mugolToast'; t.className = 'mugol-toast'; document.body.appendChild(t); }
            t.textContent = msg; t.classList.add('show');
            clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); dark = false; }
        citySelect.value = 'İstanbul';
        const inp = document.getElementById('citySearchInput');
        if (inp) inp.value = 'İstanbul';
        initCitySearch();
        renderFavStrip();
        loadWeather();

        async function downloadRegionPng(e, regionIndex) {
            e.stopPropagation();
            const btn = e.currentTarget;
            const region = REGIONS[regionIndex];
            const rows = document.querySelectorAll(`#region-${regionIndex} .bolge-city-row`);
            if (!rows.length) { alert('Veriler henüz yüklenmedi, lütfen bekleyin.'); return; }
            const origText = btn.innerHTML;
            btn.innerHTML = '⏳';
            btn.disabled = true;

            try {
                // DOM'dan şehir verilerini topla
                const allCities = [];
                rows.forEach(row => {
                    const tempEl = row.querySelector('.bcr-temp');
                    const maxSpan = tempEl?.querySelector('span:first-child');
                    const minSpan = tempEl?.querySelector('span:last-child');
                    const maxT = maxSpan ? maxSpan.textContent.trim() : '';
                    const minT = minSpan ? minSpan.textContent.trim() : '';
                    allCities.push({
                        name: row.querySelector('.bcr-name')?.textContent?.trim() || '',
                        desc: row.querySelector('.bcr-desc')?.textContent?.trim() || '',
                        icon: row.querySelector('.bcr-icon')?.textContent?.trim() || '',
                        temp: tempEl?.textContent?.trim() || '',
                        maxTemp: maxT || null,
                        minTemp: minT || null
                    });
                });

                // Nunito fontunu canvas için yükle
                try {
                    const nunitoFont = new FontFace('Nunito', 'url(https://fonts.gstatic.com/s/nunito/v26/XRXI3I6Li01BKofiOc5wtlZ2di8HDIkh.woff2)');
                    await nunitoFont.load();
                    document.fonts.add(nunitoFont);
                } catch(_) { /* font yüklenemezse sistem fontu kullanılır */ }

                // Logo
                const logoImg = await new Promise(res => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => res(img);
                    img.onerror = () => res(null);
                    img.src = './logo.png';
                });

                // Tarih
                const now = new Date();
                const gunAdi  = now.toLocaleDateString('tr-TR', { weekday: 'long' });
                const tarihStr = now.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });

                // ── Tüm iller tek sayfada ──
                const pages = [allCities];
                const totalPages = 1;

                // ── Tek sayfa canvas çiz ve indir (Geliştirilmiş Tasarım v2) ──
                function drawAndDownload(cities, pageNum) {
                    const PW        = 1080;
                    const MAX_H     = 1350;
                    // Sabit alanlar: header(116) + info üst boşluk(52) + info içerik(126) + sep boşluk(32) + footer(148)
                    const FIXED_H   = 116 + 52 + 126 + 32 + 148;
                    const AVAIL_H   = MAX_H - FIXED_H;           // liste için max alan
                    const IDEAL_ROW = 112;                        // ideal satır yüksekliği
                    const MIN_ROW   = 64;                         // minimum satır yüksekliği
                    // İl sayısına göre satır yüksekliği: ideal, ama max yüksekliği geçmeyecek
                    const ROW_H_FIXED = Math.max(MIN_ROW, Math.min(IDEAL_ROW, Math.floor(AVAIL_H / cities.length)));
                    const TOTAL_H   = FIXED_H + cities.length * ROW_H_FIXED;

                    const fc = document.createElement('canvas');
                    fc.width  = PW;
                    fc.height = TOTAL_H;
                    const ctx = fc.getContext('2d');

                    // Yardımcı: yuvarlak köşeli dikdörtgen
                    function rr(x,y,w,h,r){
                        ctx.beginPath();
                        ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
                        ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
                        ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
                        ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
                        ctx.closePath();
                    }

                    // ── ARKA PLAN: Premium gökyüzü gradyanı ──
                    const bgGrad = ctx.createLinearGradient(0, 0, PW * 0.4, TOTAL_H);
                    bgGrad.addColorStop(0,   '#e8f5fd');
                    bgGrad.addColorStop(0.35, '#d6ecf8');
                    bgGrad.addColorStop(0.7, '#c4e0f4');
                    bgGrad.addColorStop(1,   '#b0d4ef');
                    ctx.fillStyle = bgGrad;
                    ctx.fillRect(0, 0, PW, TOTAL_H);

                    // Dekoratif yumuşak daireler (ambient)
                    ctx.save();
                    ctx.globalAlpha = 0.13;
                    ctx.fillStyle = region.color;
                    ctx.beginPath(); ctx.arc(PW + 100, -100, 560, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 0.08;
                    ctx.beginPath(); ctx.arc(-100, TOTAL_H + 100, 500, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 0.04;
                    ctx.fillStyle = '#0d4e82';
                    ctx.beginPath(); ctx.arc(PW/2, TOTAL_H * 0.48, 720, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 0.055;
                    ctx.fillStyle = region.color;
                    ctx.beginPath(); ctx.arc(PW * 0.15, TOTAL_H * 0.62, 380, 0, Math.PI*2); ctx.fill();
                    ctx.restore();

                    // ── ÜST BAŞLIK BANDI ──
                    const HDR_BAR_H = 126;
                    const hdrGrad = ctx.createLinearGradient(0, 0, PW, HDR_BAR_H);
                    hdrGrad.addColorStop(0,   region.color);
                    hdrGrad.addColorStop(0.5, region.color + 'ee');
                    hdrGrad.addColorStop(1,   region.color + 'cc');
                    ctx.fillStyle = hdrGrad;
                    ctx.fillRect(0, 0, PW, HDR_BAR_H);

                    // Header iç parlaklık — daha belirgin
                    const hdrShine = ctx.createLinearGradient(0, 0, 0, HDR_BAR_H * 0.6);
                    hdrShine.addColorStop(0, 'rgba(255,255,255,0.25)');
                    hdrShine.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = hdrShine;
                    ctx.fillRect(0, 0, PW, HDR_BAR_H);

                    // Header alt yumuşak gölge
                    const hdrShadow = ctx.createLinearGradient(0, HDR_BAR_H, 0, HDR_BAR_H + 40);
                    hdrShadow.addColorStop(0, 'rgba(0,0,0,0.14)');
                    hdrShadow.addColorStop(1, 'transparent');
                    ctx.fillStyle = hdrShadow;
                    ctx.fillRect(0, HDR_BAR_H, PW, 40);

                    // "HAVA DURUMU" pill - premium, daha büyük ve belirgin
                    const pillW = 360, pillH = 60, pillX = PW/2 - pillW/2, pillY = HDR_BAR_H/2 - pillH/2;
                    // Pill dış gölgesi
                    ctx.save();
                    ctx.shadowColor = 'rgba(0,0,0,0.28)';
                    ctx.shadowBlur = 20;
                    ctx.shadowOffsetY = 6;
                    ctx.fillStyle = 'rgba(255,255,255,0.26)';
                    rr(pillX, pillY, pillW, pillH, 30); ctx.fill();
                    ctx.restore();
                    // Pill iç parlaklık
                    const pillShineG = ctx.createLinearGradient(0, pillY, 0, pillY + pillH * 0.55);
                    pillShineG.addColorStop(0, 'rgba(255,255,255,0.22)');
                    pillShineG.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = pillShineG;
                    rr(pillX, pillY, pillW, pillH, 30); ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.72)'; ctx.lineWidth = 2.5;
                    rr(pillX, pillY, pillW, pillH, 30); ctx.stroke();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = "900 30px 'Nunito', sans-serif";
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('HAVA DURUMU', PW/2, HDR_BAR_H/2 + 1);

                    // ── BÖLGE + TARİH BİLGİ ALANI ──
                    const INFO_Y = HDR_BAR_H + 52;
                    const PADX   = 66;

                    const subLabelTxt = totalPages > 1
                        ? `${allCities.length} il · Sayfa ${pageNum}/${totalPages}`
                        : `${allCities.length} il · Anlık Güncelleme`;

                    // Bölge adı - büyük bold
                    ctx.fillStyle = '#142d4c';
                    ctx.font = "900 60px 'Nunito', sans-serif";
                    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                    ctx.fillText(region.name, PADX, INFO_Y);

                    // Alt etiket (il sayısı/sayfa)
                    ctx.fillStyle = '#4a82aa';
                    ctx.font = "700 27px 'Nunito', sans-serif";
                    ctx.fillText(subLabelTxt, PADX + 2, INFO_Y + 68);

                    // Tarih pill - sağda, daha belirgin cam görünüm
                    const dpW = 340, dpH = 86, dpX = PW - PADX - dpW, dpY = INFO_Y + 2;
                    ctx.save();
                    ctx.shadowColor = 'rgba(0,40,90,0.16)';
                    ctx.shadowBlur = 22;
                    ctx.shadowOffsetY = 8;
                    ctx.fillStyle = 'rgba(26,60,100,0.11)';
                    rr(dpX, dpY, dpW, dpH, 24); ctx.fill();
                    ctx.restore();
                    // Tarih pill üst parlaklık
                    const dpShine = ctx.createLinearGradient(0, dpY, 0, dpY + dpH * 0.5);
                    dpShine.addColorStop(0, 'rgba(255,255,255,0.16)');
                    dpShine.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = dpShine;
                    rr(dpX, dpY, dpW, dpH, 24); ctx.fill();
                    ctx.strokeStyle = 'rgba(26,80,130,0.26)'; ctx.lineWidth = 1.5;
                    rr(dpX, dpY, dpW, dpH, 24); ctx.stroke();

                    ctx.fillStyle = '#142d4c';
                    ctx.font = "800 28px 'Nunito', sans-serif";
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(gunAdi.toUpperCase(), dpX + dpW/2, dpY + 30);
                    ctx.font = "600 24px 'Nunito', sans-serif";
                    ctx.fillStyle = '#4a82aa';
                    ctx.fillText(tarihStr, dpX + dpW/2, dpY + 60);

                    // Ayırıcı çizgi - gradient
                    const SEP_Y = INFO_Y + 126;
                    const sepGrad = ctx.createLinearGradient(PADX, 0, PW - PADX, 0);
                    sepGrad.addColorStop(0, 'transparent');
                    sepGrad.addColorStop(0.15, 'rgba(26,80,130,0.18)');
                    sepGrad.addColorStop(0.85, 'rgba(26,80,130,0.18)');
                    sepGrad.addColorStop(1, 'transparent');
                    ctx.strokeStyle = sepGrad; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.moveTo(PADX, SEP_Y); ctx.lineTo(PW - PADX, SEP_Y); ctx.stroke();

                    // ── ŞEHİR SATIRLARI ──
                    const LIST_START_Y = SEP_Y + 16;
                    const LIST_END_Y   = TOTAL_H - 118;
                    const ROW_H = ROW_H_FIXED;
                    const CARD_W = PW - PADX * 2;

                    cities.forEach((city, i) => {
                        const ry   = LIST_START_Y + i * ROW_H;
                        const midY = ry + ROW_H / 2;
                        const isEven = i % 2 === 0;

                        // Satır kart arka planı - daha belirgin, premium görünüm
                        ctx.save();
                        ctx.shadowColor = 'rgba(0,30,80,0.14)';
                        ctx.shadowBlur = 14;
                        ctx.shadowOffsetY = 4;
                        ctx.fillStyle = isEven ? 'rgba(255,255,255,0.60)' : 'rgba(255,255,255,0.28)';
                        rr(PADX, ry + 5, CARD_W, ROW_H - 10, 18); ctx.fill();
                        // Kart üst parlaklık
                        const cardShine = ctx.createLinearGradient(0, ry + 5, 0, ry + 5 + (ROW_H-10) * 0.45);
                        cardShine.addColorStop(0, isEven ? 'rgba(255,255,255,0.42)' : 'rgba(255,255,255,0.18)');
                        cardShine.addColorStop(1, 'transparent');
                        ctx.fillStyle = cardShine;
                        rr(PADX, ry + 5, CARD_W, ROW_H - 10, 18); ctx.fill();
                        // Kart ince border
                        ctx.strokeStyle = isEven ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.20)';
                        ctx.lineWidth = 1;
                        rr(PADX, ry + 5, CARD_W, ROW_H - 10, 18); ctx.stroke();
                        ctx.restore();

                        // Sol aksan çizgi - daha kalın, parlak gradient
                        ctx.save();
                        ctx.shadowColor = region.color + 'aa';
                        ctx.shadowBlur = 16;
                        const accentGrad = ctx.createLinearGradient(0, ry + 14, 0, ry + ROW_H - 14);
                        accentGrad.addColorStop(0, region.color + 'ff');
                        accentGrad.addColorStop(0.5, region.color + 'ee');
                        accentGrad.addColorStop(1, region.color + '99');
                        ctx.fillStyle = accentGrad;
                        ctx.beginPath(); ctx.roundRect(PADX + 2, ry + 14, 8, ROW_H - 28, 5); ctx.fill();
                        ctx.restore();

                        // Satır ayırıcı (son satır hariç)
                        if (i < cities.length - 1) {
                            const divGrad = ctx.createLinearGradient(PADX + 20, 0, PW - PADX - 20, 0);
                            divGrad.addColorStop(0, 'transparent');
                            divGrad.addColorStop(0.1, 'rgba(26,80,130,0.09)');
                            divGrad.addColorStop(0.9, 'rgba(26,80,130,0.09)');
                            divGrad.addColorStop(1, 'transparent');
                            ctx.strokeStyle = divGrad; ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(PADX + 20, ry + ROW_H);
                            ctx.lineTo(PW - PADX - 20, ry + ROW_H);
                            ctx.stroke();
                        }

                        // ── Satır fontları ROW_H'a göre ölçeklenir ──
                        const S = ROW_H / 112; // ölçek faktörü (ideal=1.0)
                        const fCity  = Math.round(44 * S);   // şehir adı font
                        const fDesc  = Math.round(24 * S);   // hava tanımı font
                        const fNum   = Math.round(22 * S);   // numara font
                        const fTemp  = Math.round(46 * S);   // sıcaklık font
                        const fSlash = Math.round(38 * S);   // ayraç font
                        const fIcon  = Math.round(72 * S);   // ikon font (büyütüldü: 58→72)
                        const numBoxSz   = Math.round(52 * S);
                        const numBoxX    = PADX + Math.round(18 * S);
                        const TEXT_START_X = PADX + Math.round(88 * S);
                        // İkon ve sıcaklık bloğu sağ tarafta; ikon 290px solda sabit orantılı
                        const ICON_CX    = PW - PADX - Math.round(265 * S);
                        const TEMP_RIGHT = PW - PADX - 18;

                        // Sıra numarası kutusu
                        ctx.fillStyle = region.color + '28';
                        rr(numBoxX, midY - numBoxSz/2, numBoxSz, numBoxSz, Math.round(14*S)); ctx.fill();
                        ctx.strokeStyle = region.color + '55'; ctx.lineWidth = 1.5;
                        rr(numBoxX, midY - numBoxSz/2, numBoxSz, numBoxSz, Math.round(14*S)); ctx.stroke();
                        ctx.fillStyle = region.color;
                        ctx.font = `800 ${fNum}px 'Nunito', sans-serif`;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText((i+1).toString().padStart(2,'0'), numBoxX + numBoxSz/2, midY);

                        // Şehir adı
                        ctx.fillStyle = '#0d2540';
                        ctx.font = `900 ${fCity}px 'Nunito', sans-serif`;
                        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                        ctx.fillText(city.name, TEXT_START_X, midY);

                        // Hava tanımı
                        ctx.font = `900 ${fCity}px 'Nunito', sans-serif`; // ölçüm için
                        const nw = ctx.measureText(city.name).width;
                        ctx.fillStyle = '#5a8ab0';
                        ctx.font = `600 ${fDesc}px 'Nunito', sans-serif`;
                        ctx.textBaseline = 'middle';
                        const RIGHT_BLOCK_X = ICON_CX - Math.round(fIcon/2);
                        const descMaxX = RIGHT_BLOCK_X - 10;
                        const descX = TEXT_START_X + nw + 12;
                        if (descX < descMaxX) {
                            ctx.fillText(city.desc, descX, midY);
                        }

                        // Hava ikonu - daha büyük ve belirgin
                        ctx.save();
                        ctx.shadowColor = 'rgba(0,30,80,0.35)';
                        ctx.shadowBlur = 16;
                        ctx.shadowOffsetY = 5;
                        ctx.font = `${fIcon}px sans-serif`;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText(city.icon, ICON_CX, midY);
                        ctx.restore();

                        // Sıcaklık - sağda max/min veya tek değer
                        if (city.maxTemp && city.minTemp) {
                            ctx.fillStyle = '#c0392b';
                            ctx.font = `900 ${fTemp}px 'Nunito', sans-serif`;
                            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                            const maxW = ctx.measureText(city.maxTemp).width;
                            ctx.fillText(city.maxTemp, TEMP_RIGHT - maxW - 12, midY);
                            ctx.fillStyle = '#8aa8c4';
                            ctx.font = `700 ${fSlash}px 'Nunito', sans-serif`;
                            ctx.fillText('/', TEMP_RIGHT - maxW - 2, midY);
                            ctx.fillStyle = '#2471a3';
                            ctx.font = `900 ${fTemp}px 'Nunito', sans-serif`;
                            ctx.textAlign = 'right';
                            ctx.fillText(city.minTemp, TEMP_RIGHT, midY);
                        } else {
                            ctx.fillStyle = '#0e2440';
                            ctx.font = `900 ${Math.round(52*S)}px 'Nunito', sans-serif`;
                            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                            ctx.fillText(city.temp, TEMP_RIGHT, midY);
                        }
                    });

                    // ── ALT FOOTER BANDI ──
                    const FOOT_Y = TOTAL_H - 118;

                    // Footer üst fade — daha geniş geçiş
                    const footFade = ctx.createLinearGradient(0, FOOT_Y - 40, 0, FOOT_Y);
                    footFade.addColorStop(0, 'transparent');
                    footFade.addColorStop(1, 'rgba(0,0,0,0.10)');
                    ctx.fillStyle = footFade;
                    ctx.fillRect(0, FOOT_Y - 40, PW, 40);

                    // Footer ana renk — daha derin gradient
                    const footGrad = ctx.createLinearGradient(0, 0, PW, 0);
                    footGrad.addColorStop(0,   region.color);
                    footGrad.addColorStop(0.55, region.color + 'f0');
                    footGrad.addColorStop(1,   region.color + 'cc');
                    ctx.fillStyle = footGrad;
                    ctx.fillRect(0, FOOT_Y, PW, 118);

                    // Footer dikey gradient overlay
                    const footV = ctx.createLinearGradient(0, FOOT_Y, 0, FOOT_Y + 118);
                    footV.addColorStop(0, 'rgba(0,0,0,0.06)');
                    footV.addColorStop(0.5, 'rgba(0,0,0,0)');
                    footV.addColorStop(1, 'rgba(0,0,0,0.12)');
                    ctx.fillStyle = footV;
                    ctx.fillRect(0, FOOT_Y, PW, 118);

                    // Footer iç parlaklık
                    const footShine = ctx.createLinearGradient(0, FOOT_Y, 0, FOOT_Y + 50);
                    footShine.addColorStop(0, 'rgba(255,255,255,0.18)');
                    footShine.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = footShine;
                    ctx.fillRect(0, FOOT_Y, PW, 50);

                    // Logo
                    const logoSz  = 76;
                    const footMidY = FOOT_Y + 59;
                    const logoX   = PADX;

                    if (logoImg) {
                        // Logo çift halka — daha premium
                        ctx.save();
                        ctx.shadowColor = 'rgba(255,255,255,0.5)';
                        ctx.shadowBlur = 24;
                        ctx.beginPath();
                        ctx.arc(logoX + logoSz/2, footMidY, logoSz/2 + 6, 0, Math.PI*2);
                        ctx.strokeStyle = 'rgba(255,255,255,0.30)';
                        ctx.lineWidth = 4;
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(logoX + logoSz/2, footMidY, logoSz/2 + 2, 0, Math.PI*2);
                        ctx.strokeStyle = 'rgba(255,255,255,0.65)';
                        ctx.lineWidth = 2.5;
                        ctx.stroke();
                        ctx.restore();
                        // Logo resmi
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(logoX + logoSz/2, footMidY, logoSz/2, 0, Math.PI*2);
                        ctx.closePath(); ctx.clip();
                        ctx.drawImage(logoImg, logoX, footMidY - logoSz/2, logoSz, logoSz);
                        ctx.restore();
                    }

                    // MuGöl yazısı — daha büyük, gölgeli
                    ctx.save();
                    ctx.shadowColor = 'rgba(0,0,0,0.30)';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#ffffff';
                    ctx.font = "900 50px 'Nunito', sans-serif";
                    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    ctx.fillText('MuGöl', logoX + logoSz + 20, footMidY - 16);
                    ctx.restore();
                    ctx.fillStyle = 'rgba(255,255,255,0.78)';
                    ctx.font = "700 26px 'Nunito', sans-serif";
                    ctx.textAlign = 'left';
                    ctx.fillText('Hava Durumu', logoX + logoSz + 22, footMidY + 20);

                    // Sağda domain — güncellenmiş URL
                    ctx.fillStyle = 'rgba(255,255,255,0.55)';
                    ctx.font = "600 19px 'Nunito', sans-serif";
                    ctx.textAlign = 'right';
                    ctx.fillText('mugol-portal.github.io/mugol.havadurumu/', PW - PADX, footMidY + 19);

                    // İndir
                    const suffix = totalPages > 1 ? `_${pageNum}` : '';
                    const link = document.createElement('a');
                    link.download = `${region.name.replace(/ /g,'_')}_hava${suffix}.png`;
                    link.href = fc.toDataURL('image/png');
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    setTimeout(() => document.body.removeChild(link), 500);
                }

                // Tüm sayfaları sırayla indir — sayfalar arası 900ms bekle
                for (let p = 0; p < pages.length; p++) {
                    if (p > 0) await new Promise(res => setTimeout(res, 900));
                    drawAndDownload(pages[p], p + 1);
                }

            } catch(err) { console.error(err); alert('PNG oluşturulamadı: '+err.message); }
            btn.innerHTML = origText;
            btn.disabled = false;
        }
    </script>
</body>
</html>
