                const gunAdi  = now.toLocaleDateString('tr-TR', { weekday: 'long' });
                const tarihStr = now.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });

                const pages = [allCities];
                const totalPages = 1;

                function drawAndDownload(cities, pageNum, theme='dark', layout='card') {
                    // ═══════════════════════════════════════════════
                    //  4 kolonlu kart ızgarası (referans görseldeki gibi) YA DA basit liste görünümü
                    //  Üstte: tarih + bölge başlığı · sağ üstte: Logo + "MuGöl Hava Durumu"
                    //  Altta: reklam yerine gerçek verilerden üretilen HAVA UYARILARI
                    // ═══════════════════════════════════════════════
                    const PW   = 1080;
                    const PADX = 36;
                    const PADY = 16;
                    const COLS = 3;
                    const GAP  = 12;
                    const ROWS = (layout === 'list' || layout === 'table') ? cities.length : Math.ceil(cities.length / COLS);
                    const LIST_W_RATIO = 0.60; // liste kutuları daha da dar ve ortalanmış
                    const TABLE_W_RATIO = 0.60; // tek panel tablo görünümü daha dar ve ortalanmış
                    const CARD_W = layout === 'list' ? Math.floor((PW - PADX*2) * LIST_W_RATIO)
                                 : layout === 'table' ? Math.floor((PW - PADX*2) * TABLE_W_RATIO)
                                 : Math.floor((PW - PADX*2 - GAP*(COLS-1)) / COLS);
                    const LIST_X_OFFSET = (layout === 'list' || layout === 'table') ? Math.floor(((PW - PADX*2) - CARD_W) / 2) : 0;

                    const isLight = theme === 'light';
                    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
                    const hasBg = !!regionBgImg;

                    const hexToRgb = hex => [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
                    const [rc,gc,bc] = hexToRgb(region.color);
                    const accent = region.color;
                    const accentSoft = `rgba(${rc},${gc},${bc},`;

                    const clr = {
                        bg1: isLight ? '#f0f4fa' : '#090f1e',
                        bg2: isLight ? '#e2e9f5' : '#0b1628',
                        bg3: isLight ? '#d8e2f0' : '#060a14',
                        dotColor: isLight ? 'rgba(0,0,0,0.03)' : 'rgba(255,255,255,0.018)',
                        // Fotoğraf arka plan varken kartlar ÇOK şeffaf (yalnızca hafif ton) —
                        // fotoğraf yoksa eski davranış (dolgun kart) aynen korunur.
                        cardBg: hasBg
                            ? (isLight ? 'rgba(255,255,255,0.22)' : 'rgba(4,7,14,0.62)')
                            : (isLight ? 'rgba(255,255,255,0.72)' : 'rgba(255,255,255,0.04)'),
                        cardBorder: hasBg
                            ? (isLight ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.16)')
                            : (isLight ? 'rgba(0,0,0,0.08)' : 'rgba(148,197,255,0.10)'),
                        cityName: isLight ? '#0f1f3a' : '#ecf3ff',
                        maxTempColor: isLight ? '#1e293b' : '#ffffff',
                        headerBg: hasBg ? 'rgba(4,8,16,0.66)' : (isLight ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.45)'),
                        regionName: hasBg ? '#ffffff' : (isLight ? '#0f1f3a' : '#f0f6ff'),
                        dateSubtitle: hasBg ? 'rgba(230,240,255,0.75)' : (isLight ? 'rgba(30,50,90,0.62)' : 'rgba(210,225,248,0.62)'),
                        dateCardBg: hasBg ? 'rgba(0,0,0,0.28)' : (isLight ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.04)'),
                        footerBg: hasBg ? 'rgba(3,6,13,0.72)' : (isLight ? 'rgba(0,0,0,0.05)' : 'rgba(0,0,0,0.50)'),
                        footerBrand: hasBg ? '#ffffff' : (isLight ? '#0f1f3a' : '#ffffff'),
                        footerUrl: hasBg ? 'rgba(230,240,255,0.65)' : (isLight ? 'rgba(30,50,90,0.48)' : 'rgba(175,198,230,0.48)'),
                        shineStart: isLight ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.07)',
                    };

                    const ALERT_COLORS = {
                        danger:  { bar: '#ef4444', bg: isLight ? 'rgba(239,68,68,0.08)'  : 'rgba(239,68,68,0.14)'  },
                        warning: { bar: '#f59e0b', bg: isLight ? 'rgba(245,158,11,0.08)' : 'rgba(245,158,11,0.14)' },
                        info:    { bar: '#3b82f6', bg: isLight ? 'rgba(59,130,246,0.08)' : 'rgba(59,130,246,0.14)' },
                        success: { bar: '#10b981', bg: isLight ? 'rgba(16,185,129,0.08)' : 'rgba(16,185,129,0.14)' },
                    };

                    // ── Bölge uyarılarını GERÇEK verilerden üret (sabit eşikler mevcut generateWeatherAlerts ile aynı) ──
                    function generateRegionAlerts(list) {
                        const out = [];
                        let hottest=null, driest=null, windiest=null, stormCity=null, heavyRainCity=null, snowCity=null, fogCity=null;
                        list.forEach(c => {
                            const feels = (typeof c.feelsLike === 'number') ? c.feelsLike : c.tempNow;
                            if (typeof feels === 'number') {
                                const best = hottest ? ((typeof hottest.feelsLike === 'number') ? hottest.feelsLike : hottest.tempNow) : null;
                                if (best === null || feels > best) hottest = c;
                            }
                            if (typeof c.humidity === 'number' && (!driest || c.humidity < driest.humidity)) driest = c;
                            if (typeof c.windSpeed === 'number' && (!windiest || c.windSpeed > windiest.windSpeed)) windiest = c;
                            if (typeof c.code === 'number') {
                                if (c.code === 95 && !stormCity) stormCity = c;
                                else if (c.code >= 80 && c.code < 95 && !heavyRainCity) heavyRainCity = c;
                                if (c.code >= 71 && c.code <= 75 && !snowCity) snowCity = c;
                                if ((c.code === 45 || c.code === 48) && !fogCity) fogCity = c;
                            }
                        });

                        if (stormCity) out.push({ type:'danger', icon:'⛈️', title:'Gök Gürültülü Sağanak', desc:`${stormCity.name} ve çevresinde gök gürültülü sağanak görülebilir; yıldırım riskine dikkat edin.` });
                        else if (heavyRainCity) out.push({ type:'warning', icon:'🌧️', title:'Sağanak Yağış Uyarısı', desc:`${heavyRainCity.name} bölgesinde kuvvetli sağanak yağış bekleniyor.` });

                        if (hottest) {
                            const val = (typeof hottest.feelsLike === 'number') ? hottest.feelsLike : hottest.tempNow;
                            if (typeof val === 'number' && val >= 35) out.push({ type:'danger', icon:'🔥', title:'Aşırı Sıcaklık Uyarısı', desc:`${hottest.name}'de hissedilen sıcaklık ${val}°C. Öğle saatlerinde uzun süre dışarıda kalmaktan kaçının.` });
                        }
                        if (snowCity) out.push({ type:'info', icon:'❄️', title:'Kar Yağışı', desc:`${snowCity.name} bölgesinde kar yağışı etkili olabilir, yollarda dikkatli olun.` });
                        if (windiest && windiest.windSpeed >= 50) out.push({ type:'warning', icon:'🌪️', title:'Kuvvetli Rüzgâr', desc:`${windiest.name} çevresinde rüzgâr hızı ${windiest.windSpeed} km/s'ye ulaşabilir.` });
                        if (fogCity) out.push({ type:'warning', icon:'🌫️', title:'Sis Uyarısı', desc:`${fogCity.name} çevresinde görüş mesafesini azaltan sis etkili olabilir.` });
                        if (driest && driest.humidity <= 25) out.push({ type:'warning', icon:'🌵', title:'Düşük Nem Oranı', desc:`${driest.name}'de nem oranı %${driest.humidity}'e kadar düşüyor.` });

                        if (out.length === 0) out.push({ type:'success', icon:'✅', title:'Bölgede Belirgin Bir Risk Yok', desc:'Seçili iller için şu an olağanüstü bir meteorolojik uyarı bulunmuyor.' });
                        return out.slice(0, 2);
                    }

                    function wrapCanvasText(mc, text, maxWidth, maxLines) {
                        const words = String(text).split(' ');
                        const lines = [];
                        let line = '';
                        for (const w of words) {
                            const test = line ? line + ' ' + w : w;
                            if (mc.measureText(test).width > maxWidth && line) {
                                lines.push(line);
                                line = w;
                                if (lines.length === maxLines) { line = ''; break; }
                            } else {
                                line = test;
                            }
                        }
                        if (line) lines.push(line);
                        return lines.slice(0, maxLines);
                    }

                    function fitFont(mc, text, startPx, minPx, maxWidth, weight) {
                        let size = startPx;
                        mc.font = `${weight} ${size}px 'Nunito', sans-serif`;
                        while (mc.measureText(text).width > maxWidth && size > minPx) {
                            size -= 1;
                            mc.font = `${weight} ${size}px 'Nunito', sans-serif`;
                        }
                        return size;
                    }

                    // ── Alt bölüm artık uyarı kartı değil, sade bir marka şeridi (logo + isim + URL) ──
                    const alerts = generateRegionAlerts(cities); // (fonksiyon korunuyor, veri artık kullanılmıyor)
                    const FOOT_H = 96;

                    // ── Kart yüksekliği: il sayısı arttıkça kademeli küçülür, hep okunaklı kalır ──
                    // Tuval boyutu HER ZAMAN tam 1080×1350 — ne altında ne üstünde, tam.
                    // (Instagram 4:5 dikey oranı) Kartlar, mevcut satır sayısına göre bu
                    // sabit alanı tam dolduracak şekilde otomatik ölçeklenir.
                    const HDR_H = 190;
                    const TABLE_HEAD_H = 0; // başlık satırı kaldırıldı (EN YÜKSEK/EN DÜŞÜK yazmıyor)
                    const MAX_H = 1350;
                    const TOTAL_H = MAX_H;
                    const availableGridH = TOTAL_H - HDR_H - PADY*2 - FOOT_H;
                    // Liste düzeninde önce GAP sabit kalarak kart yüksekliği hesaplanır; çok sayıda
                    // il olduğunda (örn. 18 il) alt sınıra (32px) rağmen taşma olursa GAP kademeli
                    // küçültülür — böylece grid asla FOOT_H alanına taşmaz ve footer her zaman görünür.
                    let LIST_GAP = GAP;
                    let CARD_H;
                    if (layout === 'list') {
                        CARD_H = clamp(Math.floor((availableGridH - LIST_GAP*(ROWS-1)) / ROWS), 32, 90);
                        let neededH = ROWS * CARD_H + LIST_GAP * (ROWS - 1);
                        while (neededH > availableGridH && LIST_GAP > 4) {
                            LIST_GAP -= 1;
                            neededH = ROWS * CARD_H + LIST_GAP * (ROWS - 1);
                        }
                        while (neededH > availableGridH && CARD_H > 26) {
                            CARD_H -= 1;
                            neededH = ROWS * CARD_H + LIST_GAP * (ROWS - 1);
                        }
                    } else if (layout === 'table') {
                        // Tek panel: satırlar bitişik, aralarında boşluk yok (GAP=0), sadece ince çizgi ayırır.
                        LIST_GAP = 0;
                        CARD_H = clamp(Math.floor((availableGridH - TABLE_HEAD_H) / ROWS), 40, 130);
                    } else {
                        CARD_H = clamp(Math.floor((availableGridH - GAP*(ROWS-1)) / ROWS), 120, 340);
                    }
                    const GRID_GAP = layout === 'list' ? LIST_GAP : (layout === 'table' ? 0 : GAP);
                    const GRID_CONTENT_H = layout === 'table' ? (TABLE_HEAD_H + ROWS * CARD_H) : (ROWS * (CARD_H + GRID_GAP) - GRID_GAP);
                    const GRID_TOP_OFFSET = layout === 'table' ? Math.max(0, (availableGridH - GRID_CONTENT_H) / 4) : Math.max(0, (availableGridH - GRID_CONTENT_H) / 2);

                    const fc = document.createElement('canvas');
                    fc.width = PW; fc.height = TOTAL_H;
                    const ctx = fc.getContext('2d', { colorSpace: 'srgb' });

                    const rr = (x,y,w,h,r) => {
                        ctx.beginPath();
                        ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
                        ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
                        ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
                        ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
                        ctx.closePath();
                    };

                    // ── 1. ARKA PLAN ──
                    // Fotoğraf varsa: NET görünsün (Instagram tarzı referans), üstüne
                    // sadece okunabilirlik için hafif, ince bir karartma eklenir —
                    // eski kalın gradyan katmanı fotoğraflı modda uygulanmaz.
                    if (regionBgImg) {
                        const ir = regionBgImg.width / regionBgImg.height;
                        const cr = PW / TOTAL_H;
                        let dw, dh, dx, dy;
                        if (ir > cr) { dh = TOTAL_H; dw = dh * ir; dx = (PW - dw) / 2; dy = 0; }
                        else { dw = PW; dh = dw / ir; dx = 0; dy = (TOTAL_H - dh) / 2; }
                        ctx.drawImage(regionBgImg, dx, dy, dw, dh);

                        // İnce, tek yönlü karartma: üstte biraz koyu (başlık okunsun),
                        // ortada neredeyse yok, altta biraz koyu (footer/uyarı okunsun)
                        const readability = ctx.createLinearGradient(0, 0, 0, TOTAL_H);
                        readability.addColorStop(0,    'rgba(0,0,0,0.32)');
                        readability.addColorStop(0.22, 'rgba(0,0,0,0.08)');
                        readability.addColorStop(0.75, 'rgba(0,0,0,0.10)');
                        readability.addColorStop(1,    'rgba(0,0,0,0.30)');
                        ctx.fillStyle = readability;
                        ctx.fillRect(0, 0, PW, TOTAL_H);
                    } else {
                        const bg = ctx.createLinearGradient(0,0,0,TOTAL_H);
                        bg.addColorStop(0,   clr.bg1);
                        bg.addColorStop(0.5, clr.bg2);
                        bg.addColorStop(1,   clr.bg3);
                        ctx.fillStyle = bg;
                        ctx.fillRect(0,0,PW,TOTAL_H);
                    }

                    if (!hasBg) {
                        ctx.fillStyle = clr.dotColor;
                        for (let gx=22; gx<PW; gx+=44) for (let gy=22; gy<TOTAL_H; gy+=44) {
                            ctx.beginPath(); ctx.arc(gx,gy,1.2,0,Math.PI*2); ctx.fill();
                        }
                    }

                    const ga1 = ctx.createRadialGradient(0,0,0,0,0,650);
                    ga1.addColorStop(0, accentSoft+(hasBg ? '0.12)' : (isLight ? '0.18)' : '0.30)')));
                    ga1.addColorStop(1, accentSoft+'0)');
                    ctx.fillStyle = ga1; ctx.fillRect(0,0,PW,650);
                    const ga2 = ctx.createRadialGradient(PW,TOTAL_H,0,PW,TOTAL_H,520);
                    ga2.addColorStop(0, accentSoft+(isLight ? '0.10)' : '0.20)'));
                    ga2.addColorStop(1, accentSoft+'0)');
                    ctx.fillStyle = ga2; ctx.fillRect(0,TOTAL_H-520,PW,520);

                    // ── 2. BAŞLIK — solda TARİH + bölge adı, sağ üstte Logo + "MuGöl Hava Durumu" ──
                    ctx.fillStyle = clr.headerBg;
                    ctx.fillRect(0, 0, PW, HDR_H);
                    if (hasBg) {
                        // fotoğraflı arkaplanda şeridin sınırını netleştirmek için ince geçiş gölgesi
                        const headerEdge = ctx.createLinearGradient(0, HDR_H - 22, 0, HDR_H);
                        headerEdge.addColorStop(0, 'rgba(0,0,0,0)');
                        headerEdge.addColorStop(1, 'rgba(0,0,0,0.35)');
                        ctx.fillStyle = headerEdge;
                        ctx.fillRect(0, HDR_H - 22, PW, 22);
                    }

                    const stripeX = PADX, stripeY = 44, stripeH = 84;
                    const sg = ctx.createLinearGradient(0,stripeY,0,stripeY+stripeH);
                    sg.addColorStop(0, accent);
                    sg.addColorStop(1, accentSoft+'0.1)');
                    ctx.save();
                    ctx.shadowColor = accent; ctx.shadowBlur = 28;
                    ctx.fillStyle = sg;
                    rr(stripeX, stripeY, 5, stripeH, 3); ctx.fill();
                    ctx.restore();

                    const pillW = 0; // sağ üstteki marka rozeti kaldırıldı — başlık artık tüm genişliği kullanabilir

                    // ── tarih rozeti (kare kart) — büyük GÜN numarası + altında AY(tam) · YIL (referans görseldeki gibi) ──
                    const dayNum = now.getDate().toString();
                    const monFull = now.toLocaleDateString('tr-TR', { month: 'long' }).toUpperCase();
                    const yearNum = now.getFullYear().toString();
                    const subLine = `${monFull} · ${yearNum}`;

                    const dateChipW = 96;
                    const dateChipH = 96;
                    const dateChipX = PW - PADX - dateChipW, dateChipY = 34;
                    const dateTotalW = dateChipW;

                    ctx.save();
                    ctx.shadowColor = 'rgba(0,0,0,0.18)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
                    ctx.fillStyle = isLight ? '#eef2f7' : 'rgba(255,255,255,0.94)';
                    rr(dateChipX, dateChipY, dateChipW, dateChipH, 18); ctx.fill();
                    ctx.restore();
                    ctx.save();
                    ctx.strokeStyle = accentSoft+'0.55)';
                    ctx.lineWidth = 1.5;
                    rr(dateChipX, dateChipY, dateChipW, dateChipH, 18); ctx.stroke();
                    ctx.restore();

                    // büyük gün numarası
                    ctx.save();
                    ctx.fillStyle = '#0f1f3a';
                    ctx.font = "900 40px 'Nunito', sans-serif";
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(dayNum, dateChipX + dateChipW/2, dateChipY + dateChipH/2 - 12);
                    ctx.restore();

                    // alt satır: AY(tam) · YIL — kutuya sığması için otomatik küçülen font ve gerekirse harf aralığını azaltma
                    ctx.save();
                    ctx.fillStyle = accent;
                    const subMaxW = dateChipW - 12;
                    let subFs = 13;
                    let subLetterSpacing = 0.5;
                    ctx.font = `800 ${subFs}px 'Nunito', sans-serif`;
                    ctx.letterSpacing = `${subLetterSpacing}px`;
                    while (ctx.measureText(subLine).width > subMaxW && subFs > 8) {
                        subFs -= 1;
                        if (subFs <= 10) subLetterSpacing = 0.1;
                        ctx.font = `800 ${subFs}px 'Nunito', sans-serif`;
                        ctx.letterSpacing = `${subLetterSpacing}px`;
                    }
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(subLine, dateChipX + dateChipW/2, dateChipY + dateChipH/2 + 26);
                    ctx.letterSpacing = '0px';
                    ctx.restore();

                    // bölge adı
                    const titleText = `${region.emoji ? region.emoji + ' ' : ''}${region.name}`;
                    let fs = 66;
                    ctx.font = `900 ${fs}px 'Nunito', sans-serif`;
                    const titleRightGap = 56; // tarih rozeti ile başlık metni arasında güvenli boşluk
                    const maxNameW = PW - (stripeX + 22) - dateTotalW - titleRightGap;
                    while (ctx.measureText(titleText).width > maxNameW && fs > 34) {
                        fs -= 2; ctx.font = `900 ${fs}px 'Nunito', sans-serif`;
                    }
                    const titleTopY = 62; // logo/bölge adı biraz yukarı kaydırıldı
                    ctx.fillStyle = clr.regionName;
                    ctx.textBaseline = 'top';
                    ctx.fillText(titleText, stripeX + 22, titleTopY);

                    // "HAVA DURUMU" alt etiketi — küçük ama belirgin
                    ctx.save();
                    ctx.fillStyle = clr.regionName;
                    ctx.globalAlpha = 0.85;
                    ctx.font = "800 15px 'Nunito', sans-serif";
                    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                    ctx.letterSpacing = '3px';
                    ctx.fillText('HAVA DURUMU', stripeX + 24, titleTopY + fs + 14);
                    ctx.letterSpacing = '0px';
                    ctx.restore();

                    ctx.save();
                    ctx.shadowColor = accent; ctx.shadowBlur = 10;
                    ctx.fillStyle = accent;
                    ctx.fillRect(stripeX + 22, titleTopY + fs + 40, 56, 4);
                    ctx.restore();

                    // (Sağ üstteki logo/marka kutusu kaldırıldı)

                    // (İstatistik şeridi kaldırıldı: En Sıcak / Ortalama / En Soğuk artık gösterilmiyor)

                    // başlık alt çizgisi
                    const ll2 = ctx.createLinearGradient(0,0,PW,0);
                    ll2.addColorStop(0,'transparent');
                    ll2.addColorStop(0.5, accentSoft+'0.55)');
                    ll2.addColorStop(1,'transparent');
                    ctx.strokeStyle = ll2; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(0,HDR_H-1); ctx.lineTo(PW,HDR_H-1); ctx.stroke();

                    // ── 3. ŞEHİR KARTLARI — İsim + Termometre, Anlık Sıcaklık, Nem, Hissedilen (referans görseldeki gibi) ──
                    const GRID_START_Y = HDR_H + PADY + GRID_TOP_OFFSET;

                    if (layout === 'card') cities.forEach((city, i) => {
                        const col = i % COLS;
                        const row = Math.floor(i / COLS);
                        const cx = PADX + col * (CARD_W + GAP);
                        const cy = GRID_START_Y + row * (CARD_H + GAP);

                        // kart zemini
                        ctx.save();
                        ctx.fillStyle = clr.cardBg;
                        rr(cx, cy, CARD_W, CARD_H, 18); ctx.fill();
                        ctx.strokeStyle = clr.cardBorder;
                        ctx.lineWidth = 1;
                        rr(cx, cy, CARD_W, CARD_H, 18); ctx.stroke();
                        ctx.strokeStyle = accentSoft+'0.6)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(cx + 18, cy + 1.5);
                        ctx.lineTo(cx + CARD_W - 18, cy + 1.5);
                        ctx.stroke();
                        const shine = ctx.createLinearGradient(cx, cy, cx, cy+40);
                        shine.addColorStop(0, clr.shineStart);
                        shine.addColorStop(1, 'rgba(255,255,255,0)');
                        ctx.fillStyle = shine;
                        rr(cx, cy, CARD_W, CARD_H, 18); ctx.fill();
                        ctx.restore();

                        const padIn = Math.max(10, Math.round(CARD_W * 0.045));
                        // Kart yüksekliğine göre 0..1 ölçek (referans yükseklik 215px'de tasarlandı)
                        const S = clamp(CARD_H / 215, 0.6, 1.3);
                        // İçerik referans yükseklikte kartın tamamını doldurmayabilir (az il = büyük kart).
                        // Aradaki farkı elemanlar arası 3 boşluğa eşit dağıtarak içeriği kart boyunca yayıyoruz.
                        const baseContentH = 16 + 22 + 6 + 38 + 8 + 20 + 24 + 18 + 12 + 10;
                        const extraGap = Math.max(0, (CARD_H - baseContentH * S) / 3);

                        // ── sol üstte gün/sıra numarası ──
                        const idxFontSize = Math.max(9, Math.round(13 * S));
                        ctx.fillStyle = accentSoft+'0.85)';
                        ctx.font = `800 ${idxFontSize}px 'Nunito', sans-serif`;
                        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                        ctx.fillText(String(i + 1), cx + padIn, cy + padIn - 4*S);

                        // ── şehir adı (üstte ortalı, belirgin) ──
                        const nameFontSize = fitFont(ctx, city.name, Math.round(25*S), Math.max(13, Math.round(17*S)), CARD_W - padIn*2 - 30, 900);
                        ctx.fillStyle = clr.cityName;
                        ctx.font = `900 ${nameFontSize}px 'Nunito', sans-serif`;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                        ctx.fillText(city.name, cx + CARD_W/2, cy + padIn - 4*S);

                        // ── ortada büyük hava durumu ikonu ──
                        const iconFontSize = Math.max(18, Math.round(38 * S));
                        const iconY = cy + padIn + nameFontSize + 6*S;
                        ctx.save();
                        ctx.shadowColor = accentSoft+'0.55)'; ctx.shadowBlur = 10*S;
                        ctx.font = `${iconFontSize}px sans-serif`;
                        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                        ctx.fillText(city.icon || '🌡️', cx + CARD_W/2, iconY);
                        ctx.restore();

                        // ── min sıcaklık (sol, termometre ikonlu, mavi) / anlık büyük sıcaklık (sağ, beyaz) ──
                        const tempRowY = iconY + iconFontSize + Math.round(8*S) + extraGap;
                        const minFontSize = Math.max(13, Math.round(22*S));
                        ctx.save();
                        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                        ctx.font = `${Math.max(12, Math.round(19*S))}px sans-serif`;
                        ctx.fillText('🌡️', cx + padIn, tempRowY);
                        ctx.font = `900 ${minFontSize}px 'Nunito', sans-serif`;
                        ctx.fillStyle = '#38bdf8';
                        const minLabel = (city.minTemp != null) ? `${city.minTemp}°` : '—';
                        ctx.fillText(minLabel, cx + padIn + Math.round(22*S), tempRowY);
                        ctx.restore();

                        ctx.save();
                        ctx.shadowColor = accentSoft+'0.5)'; ctx.shadowBlur = 10*S;
                        ctx.fillStyle = clr.maxTempColor;
                        ctx.font = `900 ${Math.max(18, Math.round(34*S))}px 'Nunito', sans-serif`;
                        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                        const tempLabel = (city.tempNow != null) ? `${city.tempNow}°` : '—';
                        ctx.fillText(tempLabel, cx + CARD_W - padIn, tempRowY);
                        ctx.restore();

                        // ── hava durumu açıklaması (ör. AÇIK) — orta, küçük kapsül ──
                        const descY = tempRowY + Math.round(16*S) + Math.round(8*S) + extraGap;
                        const descText = (city.desc || '').toString().toUpperCase();
                        const descFontSize = Math.max(7.5, Math.round(10*S));
                        const descPillH = Math.max(13, Math.round(18*S));
                        if (descText) {
                            ctx.save();
                            ctx.font = `800 ${descFontSize}px 'Nunito', sans-serif`;
                            const descW = Math.min(ctx.measureText(descText).width + 20, CARD_W - padIn*2);
                            ctx.fillStyle = clr.dateCardBg;
                            rr(cx + CARD_W/2 - descW/2, descY, descW, descPillH, descPillH/2); ctx.fill();
                            ctx.fillStyle = clr.dateSubtitle;
                            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            ctx.letterSpacing = '0.5px';
                            ctx.fillText(descText, cx + CARD_W/2, descY + descPillH/2);
                            ctx.letterSpacing = '0px';
                            ctx.restore();
                        }

                        // ── min-max kaydırma çubuğu (slider bar) ──
                        const barY = descY + descPillH + Math.round(12*S) + extraGap;
                        const barX1 = cx + padIn, barX2 = cx + CARD_W - padIn;
                        ctx.save();
                        const barGrad = ctx.createLinearGradient(barX1, 0, barX2, 0);
                        barGrad.addColorStop(0, '#38bdf8');
                        barGrad.addColorStop(1, '#f97316');
                        ctx.strokeStyle = barGrad;
                        ctx.lineWidth = Math.max(2, 3*S);
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(barX1, barY);
                        ctx.lineTo(barX2, barY);
                        ctx.stroke();
                        ctx.fillStyle = '#38bdf8';
                        ctx.beginPath(); ctx.arc(barX1, barY, Math.max(3, 4.5*S), 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#f97316';
                        ctx.beginPath(); ctx.arc(barX2, barY, Math.max(3, 4.5*S), 0, Math.PI*2); ctx.fill();
                        ctx.restore();

                    });

                    // ── 3b. ŞEHİR LİSTESİ (basit yatay satırlar) — il adı solda, sağda SIKI grup: min° max° emoji ──
                    if (layout === 'list') cities.forEach((city, i) => {
                        const lx = PADX + LIST_X_OFFSET;
                        const ly = GRID_START_Y + i * (CARD_H + GRID_GAP);
                        const lw = CARD_W;

                        // kart gövdesi
                        ctx.save();
                        ctx.fillStyle = clr.cardBg;
                        rr(lx, ly, lw, CARD_H, 14); ctx.fill();
                        ctx.restore();

                        // güzel kart çerçevesi — bölge rengiyle uyumlu, hafif parıltılı ince gradyan hat
                        ctx.save();
                        ctx.shadowColor = accentSoft + '0.35)'; ctx.shadowBlur = 6;
                        const cardBorderGrad = ctx.createLinearGradient(lx, ly, lx + lw, ly + CARD_H);
                        cardBorderGrad.addColorStop(0, accentSoft + '0.65)');
                        cardBorderGrad.addColorStop(0.5, clr.cardBorder);
                        cardBorderGrad.addColorStop(1, accentSoft + '0.45)');
                        ctx.strokeStyle = cardBorderGrad;
                        ctx.lineWidth = 1.4;
                        rr(lx, ly, lw, CARD_H, 14); ctx.stroke();
                        ctx.restore();

                        // üst kenarda kısa vurgu şeridi
                        ctx.save();
                        ctx.strokeStyle = accentSoft+'0.6)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(lx + 14, ly + 1.5);
                        ctx.lineTo(lx + 46, ly + 1.5);
                        ctx.stroke();
                        ctx.restore();

                        const rowPadIn = 18;
                        const midY = ly + CARD_H/2;

                        // sıra no
                        ctx.fillStyle = accentSoft+'0.85)';
                        ctx.font = "800 13px 'Nunito', sans-serif";
                        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                        ctx.fillText(String(i + 1), lx + rowPadIn, midY);

                        // ── DÜZEN: İsim solda sabit başlar; açıklama isim yanında; min°/max° SAĞ KENARDA
                        // sabit sütunlarda; emoji ise kartın ortasına yakın bir konumda durur.
                        const rightEdge = lx + lw - rowPadIn;
                        const cardCenterX = lx + lw/2;

                        // Sağdaki sabit sıcaklık sütunları
                        ctx.font = "900 22px 'Nunito', sans-serif";
                        const maxColW = 52;
                        const minMaxGap = 14;
                        const minColW = 52;
                        const minRightX = rightEdge;
                        const maxRightX = minRightX - minColW - minMaxGap;

                        // emoji — kartın ortasına yakın, sıcaklık sütunlarının solunda (üstüne binmez)
                        ctx.font = "26px sans-serif";
                        const iconStr = city.icon || '🌡️';
                        const iconColW = 32;
                        const iconMinGapToTemps = 20;
                        const iconCenterX = Math.min(cardCenterX, maxRightX - maxColW - iconMinGapToTemps - iconColW/2);

                        // İsim için kullanılabilir sol alan sınırı
                        const nameX = lx + rowPadIn + 28;
                        const descGroupLeftLimit = iconCenterX - iconColW/2 - 24; // açıklamaya ayrılan maks. alan
                        const leftAvailW = Math.max(40, descGroupLeftLimit - nameX);

                        // il adı — solda (genişliği daralan kart için otomatik küçülen font, taşmayı önler)
                        const nameReserveW = Math.min(lw * 0.42, leftAvailW * 0.7);
                        const nameFs = fitFont(ctx, city.name, 20, 14, nameReserveW, 900);
                        ctx.fillStyle = clr.cityName;
                        ctx.font = `900 ${nameFs}px 'Nunito', sans-serif`;
                        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                        ctx.fillText(city.name, nameX, midY);

                        // hava durumu açıklaması — emojinin hemen SOLUNA yapıştırılır (sağa hizalı yazı)
                        const descText = (city.desc || '').toString().toUpperCase();
                        if (descText) {
                            const descRightX = iconCenterX - iconColW/2 - 14;
                            const descMaxAvailW = Math.max(30, descRightX - (nameX + nameReserveW));
                            const descFs = fitFont(ctx, descText, 12, 8, descMaxAvailW, 800);
                            ctx.font = `800 ${descFs}px 'Nunito', sans-serif`;
                            ctx.letterSpacing = '0.4px';
                            ctx.fillStyle = clr.dateSubtitle;
                            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                            ctx.fillText(descText, descRightX, midY);
                            ctx.letterSpacing = '0px';
                        }

                        // emoji (ortaya yakın, sıcaklıkların solunda)
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.save();
                        ctx.shadowColor = accentSoft+'0.5)'; ctx.shadowBlur = 6;
                        ctx.font = "26px sans-serif";
                        ctx.fillText(iconStr, iconCenterX, midY);
                        ctx.restore();

                        // max sıcaklık (sabit sütun)
                        const tempLabel = (city.tempNow != null) ? `${city.tempNow}°` : '—';
                        ctx.save();
                        ctx.shadowColor = accentSoft+'0.5)'; ctx.shadowBlur = 8;
                        ctx.fillStyle = clr.maxTempColor;
                        ctx.font = "900 22px 'Nunito', sans-serif";
                        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                        ctx.fillText(tempLabel, maxRightX, midY);
                        ctx.restore();

                        // min sıcaklık (sabit sütun)
                        const minLabel = (city.minTemp != null) ? `${city.minTemp}°` : '—';
                        ctx.fillStyle = '#38bdf8';
                        ctx.font = "900 22px 'Nunito', sans-serif";
                        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                        ctx.fillText(minLabel, minRightX, midY);
                    });

                    // ── 3c. TEK PANEL TABLO GÖRÜNÜMÜ — referans: havaforum tarzı sütunlu tablo ──
                    // Tüm iller TEK bir kutu içinde, il adı solda, "EN YÜKSEK / EN DÜŞÜK" sütun başlıklı,
                    // sağda emoji, satırlar arası ince ayırıcı çizgi.
                    if (layout === 'table') {
                        const tx = PADX + LIST_X_OFFSET;
                        const ty0 = GRID_START_Y;
                        const tw = CARD_W;
                        const panelH = TABLE_HEAD_H + ROWS * CARD_H;

                        // panel gövdesi
                        ctx.save();
                        ctx.fillStyle = clr.cardBg;
                        rr(tx, ty0, tw, panelH, 20); ctx.fill();
                        ctx.restore();

                        // panel çerçevesi
                        ctx.save();
                        ctx.shadowColor = accentSoft + '0.35)'; ctx.shadowBlur = 8;
                        const panelBorderGrad = ctx.createLinearGradient(tx, ty0, tx + tw, ty0 + panelH);
                        panelBorderGrad.addColorStop(0, accentSoft + '0.65)');
                        panelBorderGrad.addColorStop(0.5, clr.cardBorder);
                        panelBorderGrad.addColorStop(1, accentSoft + '0.45)');
                        ctx.strokeStyle = panelBorderGrad;
                        ctx.lineWidth = 1.6;
                        rr(tx, ty0, tw, panelH, 20); ctx.stroke();
                        ctx.restore();

                        // üst kenarda kısa vurgu şeridi
                        ctx.save();
                        ctx.strokeStyle = accentSoft+'0.6)';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(tx + 20, ty0 + 1.5);
                        ctx.lineTo(tx + 60, ty0 + 1.5);
                        ctx.stroke();
                        ctx.restore();

                        const tRowPadIn = 24;
                        const tRightEdge = tx + tw - tRowPadIn;
                        const tCardCenterX = tx + tw/2;

                        // Sabit sütun konumları: EN DÜŞÜK / EN YÜKSEK sağ kenarda sabit sütunlar
                        const tMinColW = 66;
                        const tMinRightX = tRightEdge;
                        const tMaxColW = 66;
                        const tMaxRightX = tMinRightX - tMinColW - 38;

                        // emoji — kartın ortasına yakın, sıcaklık sütunlarının solunda (üstüne binmez)
                        const tIconColW = 40;
                        const tIconMinGapToTemps = 26;
                        const tIconCenterX = Math.min(tCardCenterX, tMaxRightX - tMaxColW - tIconMinGapToTemps - tIconColW/2);

                        // İsim sütunu için kullanılabilir genişlik (açıklama+emoji grubuna taşmasın)
                        const tNameX = tx + tRowPadIn;
                        const tDescGroupLeftLimit = tIconCenterX - tIconColW/2 - 24;
                        const tNameAvailW = Math.max(40, (tDescGroupLeftLimit - tNameX) * 0.55);

                        cities.forEach((city, i) => {
                            const rowY = ty0 + TABLE_HEAD_H + i * CARD_H;
                            const rowMidY = rowY + CARD_H/2;

                            // satır ayırıcı çizgi (ilk satırın üstü hariç, panel çerçevesiyle çakışmasın)
                            if (i > 0) {
                                ctx.save();
                                ctx.strokeStyle = clr.cardBorder;
                                ctx.lineWidth = 1;
                                ctx.beginPath();
                                ctx.moveTo(tx + tRowPadIn, rowY);
                                ctx.lineTo(tx + tw - tRowPadIn, rowY);
                                ctx.stroke();
                                ctx.restore();
                            }

                            // il adı — solda, otomatik küçülen font (taşmayı önler)
                            const tNameFs = fitFont(ctx, city.name, 29, 17, tNameAvailW, 900);
                            ctx.fillStyle = clr.cityName;
                            ctx.font = `900 ${tNameFs}px 'Nunito', sans-serif`;
                            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                            ctx.fillText(city.name, tNameX, rowMidY);

                            // hava durumu açıklaması — emojinin hemen SOLUNA yapıştırılır (sağa hizalı yazı)
                            const tDescText = (city.desc || '').toString().toUpperCase();
                            if (tDescText) {
                                const tDescRightX = tIconCenterX - tIconColW/2 - 16;
                                const tDescMaxAvailW = Math.max(30, tDescRightX - (tNameX + tNameAvailW));
                                const tDescFs = fitFont(ctx, tDescText, 15, 9, tDescMaxAvailW, 800);
                                ctx.font = `800 ${tDescFs}px 'Nunito', sans-serif`;
                                ctx.letterSpacing = '0.4px';
                                ctx.fillStyle = clr.dateSubtitle;
                                ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                                ctx.fillText(tDescText, tDescRightX, rowMidY);
                                ctx.letterSpacing = '0px';
                            }

                            // en yüksek (max) sıcaklık
                            const tMaxLabel = (city.tempNow != null) ? `${city.tempNow}°` : '—';
                            ctx.save();
                            ctx.shadowColor = accentSoft+'0.5)'; ctx.shadowBlur = 8;
                            ctx.fillStyle = clr.maxTempColor;
                            ctx.font = "900 32px 'Nunito', sans-serif";
                            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                            ctx.fillText(tMaxLabel, tMaxRightX, rowMidY);
                            ctx.restore();

                            // en düşük (min) sıcaklık
                            const tMinLabel = (city.minTemp != null) ? `${city.minTemp}°` : '—';
                            ctx.fillStyle = '#38bdf8';
                            ctx.font = "900 32px 'Nunito', sans-serif";
                            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                            ctx.fillText(tMinLabel, tMinRightX, rowMidY);

                            // emoji — kartın ortasına yakın
                            ctx.save();
                            ctx.shadowColor = accentSoft+'0.5)'; ctx.shadowBlur = 6;
                            ctx.font = "34px sans-serif";
                            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            ctx.fillText(city.icon || '🌡️', tIconCenterX, rowMidY);
                            ctx.restore();
                        });
                    }

                    // ── 4. ALT BÖLÜM: Marka şeridi (logo + uygulama adı + URL) ──
                    const FY = TOTAL_H - FOOT_H;
                    if (hasBg) {
                        // fotoğraflı arkaplanda footer sınırını netleştirmek için ince geçiş gölgesi
                        const footerEdge = ctx.createLinearGradient(0, FY - 24, 0, FY);
                        footerEdge.addColorStop(0, 'rgba(0,0,0,0)');
                        footerEdge.addColorStop(1, 'rgba(0,0,0,0.30)');
                        ctx.fillStyle = footerEdge;
                        ctx.fillRect(0, FY - 24, PW, 24);
                    }
                    const fl = ctx.createLinearGradient(0,0,PW,0);
                    fl.addColorStop(0,'transparent');
                    fl.addColorStop(0.5, accent);
                    fl.addColorStop(1,'transparent');
                    ctx.fillStyle = fl;
                    ctx.fillRect(0, FY, PW, 2);
                    ctx.fillStyle = clr.footerBg;
                    ctx.fillRect(0, FY+2, PW, FOOT_H-2);

                    const footLogoSz = 44;
                    const footLcx = PADX, footLcy = FY + (FOOT_H - footLogoSz)/2;
                    if (logoImg) {
                        ctx.save();
                        ctx.beginPath(); rr(footLcx, footLcy, footLogoSz, footLogoSz, 12); ctx.clip();
                        ctx.fillStyle = '#fff'; ctx.fillRect(footLcx, footLcy, footLogoSz, footLogoSz);
                        ctx.drawImage(logoImg, footLcx, footLcy, footLogoSz, footLogoSz);
                        ctx.restore();
                        ctx.strokeStyle = accentSoft+'0.6)'; ctx.lineWidth = 1.5;
                        rr(footLcx, footLcy, footLogoSz, footLogoSz, 12); ctx.stroke();
                    }

                    const footTx = footLcx + footLogoSz + 16;
                    ctx.fillStyle = clr.footerBrand;
                    ctx.font = "900 21px 'Nunito', sans-serif";
                    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    ctx.fillText('MuGöl', footTx, FY + FOOT_H/2 - 11);
                    ctx.fillStyle = accent;
                    ctx.font = "800 10.5px 'Nunito', sans-serif";
                    ctx.letterSpacing = '2.2px';
                    ctx.fillText('HAVA DURUMU', footTx, FY + FOOT_H/2 + 12);
                    ctx.letterSpacing = '0px';

                    ctx.fillStyle = clr.footerUrl;
                    ctx.font = "600 13px 'Nunito', sans-serif";
                    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
                    ctx.fillText('mugol-portal.github.io/mugol.havadurumu/', PW - PADX, FY + FOOT_H/2);

                    // ── YENİ ÖZELLİK: oluşturulma saati damgası ──
                    ctx.save();
                    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
                    ctx.fillStyle = clr.footerUrl;
                    ctx.font = "600 11px 'Nunito', sans-serif";
                    const saatStr = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                    ctx.fillText(`Oluşturuldu: ${saatStr}`, PW - PADX, TOTAL_H - 14);
                    ctx.restore();

                    return fc.toDataURL('image/png');
                }

                // ── ÖNİZLEME MODAL ──
                let currentLayout = 'card';

                function renderPreview() {
                    const dataUrl = drawAndDownload(pages[0], 1, 'dark', currentLayout);
                    const img = document.getElementById('png-preview-img');
                    if (img) img.src = dataUrl;
                }

                // Modal HTML oluştur
                const existingModal = document.getElementById('png-preview-modal');
                if (existingModal) existingModal.remove();

                const modal = document.createElement('div');
                modal.id = 'png-preview-modal';
                modal.style.cssText = `
                    position:fixed;inset:0;z-index:99999;
                    background:rgba(0,0,0,0.82);backdrop-filter:blur(14px);
                    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
                    padding:20px 16px 24px;overflow-y:auto;
                `;
                modal.innerHTML = `
                    <div style="width:100%;max-width:420px;">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                            <span style="font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;color:#f0f6ff;letter-spacing:-0.02em;">Önizleme</span>
                            <button id="modal-close-btn" style="
                                width:36px;height:36px;border-radius:10px;border:none;
                                background:rgba(255,255,255,0.08);color:#93c5fd;font-size:1.2rem;
                                cursor:pointer;display:flex;align-items:center;justify-content:center;
                                font-family:'Nunito',sans-serif;
                            ">✕</button>
                        </div>

                        <!-- Görünüm seçici -->
                        <div style="display:flex;gap:8px;margin-bottom:14px;">
                            <button id="layout-card-btn" style="
                                flex:1;padding:10px 6px;border-radius:12px;border:2px solid rgba(96,200,245,0.6);
                                background:rgba(96,200,245,0.12);color:#60c8f5;
                                font-family:'Nunito',sans-serif;font-weight:800;font-size:0.76rem;
                                cursor:pointer;letter-spacing:0.02em;transition:all 0.2s;
                            ">🗂️ KART</button>
                            <button id="layout-list-btn" style="
                                flex:1;padding:10px 6px;border-radius:12px;border:2px solid rgba(255,255,255,0.15);
                                background:rgba(255,255,255,0.05);color:#94a3b8;
                                font-family:'Nunito',sans-serif;font-weight:800;font-size:0.76rem;
                                cursor:pointer;letter-spacing:0.02em;transition:all 0.2s;
                            ">📋 LİSTE</button>
                            <button id="layout-table-btn" style="
                                flex:1;padding:10px 6px;border-radius:12px;border:2px solid rgba(255,255,255,0.15);
                                background:rgba(255,255,255,0.05);color:#94a3b8;
                                font-family:'Nunito',sans-serif;font-weight:800;font-size:0.76rem;
                                cursor:pointer;letter-spacing:0.02em;transition:all 0.2s;
                            ">📊 TABLO</button>
                        </div>

                        <!-- Önizleme resmi -->
                        <div style="border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);margin-bottom:14px;line-height:0;">
                            <img id="png-preview-img" style="width:100%;display:block;" />
                        </div>

                        <!-- İndir butonu -->
                        <button id="modal-download-btn" style="
                            width:100%;padding:16px;border-radius:14px;border:none;
                            background:linear-gradient(135deg,#38bdf8,#818cf8);
                            color:#071628;font-family:'Nunito',sans-serif;font-weight:900;
                            font-size:1rem;cursor:pointer;letter-spacing:0.02em;
                            box-shadow:0 8px 24px rgba(56,189,248,0.35);
                        ">⬇ PNG İndir</button>
                    </div>
                `;
                document.body.appendChild(modal);

                // Görünüm (kart/liste/tablo) toggle mantığı
                function setLayout(l) {
                    currentLayout = l;
                    const btns = {
                        card: document.getElementById('layout-card-btn'),
                        list: document.getElementById('layout-list-btn'),
                        table: document.getElementById('layout-table-btn'),
                    };
                    Object.keys(btns).forEach(key => {
                        const btn = btns[key];
                        if (!btn) return;
                        if (key === l) {
                            btn.style.border = '2px solid rgba(96,200,245,0.7)';
                            btn.style.background = 'rgba(96,200,245,0.15)';
                            btn.style.color = '#60c8f5';
                        } else {
                            btn.style.border = '2px solid rgba(255,255,255,0.12)';
                            btn.style.background = 'rgba(255,255,255,0.04)';
                            btn.style.color = '#64748b';
                        }
                    });
                    renderPreview();
                }

                document.getElementById('layout-card-btn').onclick = () => setLayout('card');
                document.getElementById('layout-list-btn').onclick = () => setLayout('list');
                document.getElementById('layout-table-btn').onclick = () => setLayout('table');
                document.getElementById('modal-close-btn').onclick = () => modal.remove();
                modal.addEventListener('click', (ev) => { if (ev.target === modal) modal.remove(); });

                document.getElementById('modal-download-btn').onclick = () => {
                    const dataUrl = drawAndDownload(pages[0], 1, 'dark', currentLayout);
                    const link = document.createElement('a');
                    link.download = `${region.name.replace(/ /g,'_')}_hava.png`;
                    link.href = dataUrl;
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    setTimeout(() => { document.body.removeChild(link); modal.remove(); }, 500);
                };

                // İlk önizlemeyi render et
                renderPreview();

            } catch(err) { console.error(err); alert('PNG oluşturulamadı: '+err.message); }
            btn.innerHTML = origText;
            btn.disabled = false;
        }

        // ═══════════════════════════════════════════════════════════
        //  ŞEHİR (İL) HAVA DURUMU EKRANI — PNG İNDİRME
        //  Bölgesel PNG özelliğiyle aynı görsel dil ve modal akışı;
        //  tek şehrin sıcaklık/saatlik/günlük/detay verilerinden üretilir.
        // ═══════════════════════════════════════════════════════════
        async function downloadCityPng(e) {
            e.stopPropagation();
            const btn = e.currentTarget;
            const d = cityDataCache;
            if (!d.city || !d.current) { alert('Veriler henüz yüklenmedi, lütfen bekleyin.'); return; }
            const origText = btn.innerHTML;
            btn.innerHTML = '⏳';
            btn.disabled = true;

            try {
                // Nunito fontunu canvas için yükle
                try {
                    const nunitoFont = new FontFace('Nunito', 'url(https://fonts.gstatic.com/s/nunito/v26/XRXI3I6Li01BKofiOc5wtlZ2di8HDIkh.woff2)');
                    await nunitoFont.load();
                    document.fonts.add(nunitoFont);
                } catch(_) {}

                // Logo
                const logoImg = await new Promise(res => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => res(img);
                    img.onerror = () => res(null);
                    img.src = './logo.png';
                });

                const now = new Date();
                const gunAdi   = now.toLocaleDateString('tr-TR', { weekday: 'long' });
                const tarihStr = now.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
                const accent = '#14b8c4';

                function drawCity(theme='dark') {
                    const PW = 1080, PADX = 44;
                    const isLight = theme === 'light';
                    const hexToRgb = hex => [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];
                    const [rc,gc,bc] = hexToRgb(accent);
                    const accentSoft = `rgba(${rc},${gc},${bc},`;

                    const clr = {
                        bg1: isLight ? '#f0f4fa' : '#090f1e',
                        bg2: isLight ? '#e2e9f5' : '#0b1628',
                        bg3: isLight ? '#d8e2f0' : '#060a14',
                        dotColor: isLight ? 'rgba(0,0,0,0.03)' : 'rgba(255,255,255,0.018)',
                        cardBg: isLight ? 'rgba(255,255,255,0.72)' : 'rgba(255,255,255,0.04)',
                        cardBorder: isLight ? 'rgba(0,0,0,0.08)' : 'rgba(148,197,255,0.10)',
                        cityName: isLight ? '#0f1f3a' : '#f0f6ff',
                        tempColor: isLight ? '#0f1f3a' : '#ffffff',
                        descColor: accent,
                        headerBg: isLight ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.25)',
                        dateCardBg: isLight ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.04)',
                        footerBrand: isLight ? '#0f1f3a' : '#ffffff',
                        footerUrl: isLight ? 'rgba(30,50,90,0.48)' : 'rgba(175,198,230,0.48)',
                        labelColor: isLight ? 'rgba(30,50,90,0.62)' : 'rgba(210,225,248,0.62)',
                    };

                    const rr = (ctx,x,y,w,h,r) => {
                        ctx.beginPath();
                        ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
                        ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
                        ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
                        ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
                        ctx.closePath();
                    };

                    // Kartın toplam yüksekliğini içerik miktarına göre hesapla (5 gün + 8 saatlik pill + detay kartları)
                    // NOT: Bu değerler aşağıdaki gerçek çizim akışıyla (heroY, hSectionTop, dTop, detailTop, secY zinciri)
                    // birebir aynı formüllerle hesaplanır — sapma olursa alt bölümler taşar/kesilir.
                    const HDR_H = 150;
                    const HERO_H = 470;
                    const HOURLY_TITLE_H = 44;   // başlık + boşluk (hSectionTop = secY + 44)
                    const HOURLY_CARDS_H = 132;  // saatlik kart yüksekliği (HOURLY_H-44 eski değeriyle aynı)
                    const DAILY_ROW_H = 68;
                    const DAILY_TITLE_H = 44;    // başlık + boşluk (dTop = secY + 44)
                    const DETAIL_TITLE_H = 44;   // başlık + boşluk (detailTop = secY + 44)
                    const DETAIL_ROWS = Math.ceil(4 / 2); // detailItems 4 öğe, 2 sütun → 2 satır
                    const DETAIL_ROW_H = 90;
                    const DETAIL_GAP = 12;
                    const DETAIL_H = DETAIL_ROWS * DETAIL_ROW_H + (DETAIL_ROWS - 1) * DETAIL_GAP;
                    const FOOT_H = 46;
                    const PADY_SEC = 16;
                    const GAP_BEFORE_SECTION = 30; // her yeni section başlığından önceki boşluk (secY = ... + 30)

                    const TOTAL_H = HDR_H + HERO_H + PADY_SEC
                        + HOURLY_TITLE_H + HOURLY_CARDS_H + PADY_SEC + GAP_BEFORE_SECTION
                        + DAILY_TITLE_H + d.dailyData.length * DAILY_ROW_H + PADY_SEC + GAP_BEFORE_SECTION
                        + DETAIL_TITLE_H + DETAIL_H + FOOT_H;

                    const fc = document.createElement('canvas');
                    fc.width = PW; fc.height = TOTAL_H;
                    const ctx = fc.getContext('2d', { colorSpace: 'srgb' });

                    // ── ARKA PLAN ──
                    const bg = ctx.createLinearGradient(0,0,0,TOTAL_H);
                    bg.addColorStop(0, clr.bg1); bg.addColorStop(0.5, clr.bg2); bg.addColorStop(1, clr.bg3);
                    ctx.fillStyle = bg; ctx.fillRect(0,0,PW,TOTAL_H);

                    ctx.fillStyle = clr.dotColor;
                    for (let gx=22; gx<PW; gx+=44) for (let gy=22; gy<TOTAL_H; gy+=44) {
                        ctx.beginPath(); ctx.arc(gx,gy,1.2,0,Math.PI*2); ctx.fill();
                    }
                    // Üstten yumuşak vurgu ışıması
                    const ga1 = ctx.createRadialGradient(PW/2,0,0,PW/2,0,650);
                    ga1.addColorStop(0, accentSoft+(isLight?'0.16)':'0.26)'));
                    ga1.addColorStop(1, accentSoft+'0)');
                    ctx.fillStyle = ga1; ctx.fillRect(0,0,PW,650);

                    // İkinci köşe ışıması — sağ üstten hafif ikincil glow, derinlik hissi katar
                    const ga2 = ctx.createRadialGradient(PW*0.86,60,0,PW*0.86,60,420);
                    ga2.addColorStop(0, accentSoft+(isLight?'0.10)':'0.14)'));
                    ga2.addColorStop(1, accentSoft+'0)');
                    ctx.fillStyle = ga2; ctx.fillRect(0,0,PW,520);

                    // Alt köşeden çok hafif zıt ton — sıcaklık/karşıtlık için
                    const ga3 = ctx.createRadialGradient(PW*0.18,TOTAL_H*0.94,0,PW*0.18,TOTAL_H*0.94,520);
                    ga3.addColorStop(0, accentSoft+(isLight?'0.05)':'0.08)'));
                    ga3.addColorStop(1, accentSoft+'0)');
                    ctx.fillStyle = ga3; ctx.fillRect(0,TOTAL_H-560,PW,560);

                    // İnce üst vinyet — header'ı zemine yumuşak biçimde bağlar
                    const topFade = ctx.createLinearGradient(0,0,0,HDR_H+40);
                    topFade.addColorStop(0, isLight ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.18)');
                    topFade.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = topFade; ctx.fillRect(0,0,PW,HDR_H+40);

                    // ── ÜST BAR: tarih rozeti solda, logo+marka sağda ──
                    ctx.fillStyle = clr.headerBg; ctx.fillRect(0,0,PW,HDR_H);

                    const dateText = `${gunAdi.toUpperCase()} · ${tarihStr}`;
                    ctx.font = "900 15px 'Nunito', sans-serif";
                    ctx.letterSpacing = '1.5px';
                    const dateTextW = ctx.measureText(dateText).width;
                    ctx.letterSpacing = '0px';
                    const dateChipH = 36, dateChipX = PADX, dateChipY = (HDR_H-dateChipH)/2;
                    const dateChipW = dateTextW + 60;
                    ctx.save();
                    ctx.fillStyle = accentSoft+'0.16)';
                    rr(ctx,dateChipX,dateChipY,dateChipW,dateChipH,10); ctx.fill();
                    ctx.strokeStyle = accentSoft+'0.45)'; ctx.lineWidth = 1.3;
                    rr(ctx,dateChipX,dateChipY,dateChipW,dateChipH,10); ctx.stroke();
                    ctx.restore();
                    ctx.save();
                    ctx.beginPath(); ctx.fillStyle = accent;
                    ctx.shadowColor = accent; ctx.shadowBlur = 8;
                    ctx.arc(dateChipX+18, dateChipY+dateChipH/2, 4.5, 0, Math.PI*2); ctx.fill();
                    ctx.restore();
                    ctx.save();
                    ctx.shadowColor = accent; ctx.shadowBlur = 6;
                    ctx.fillStyle = accent;
                    ctx.font = "900 15px 'Nunito', sans-serif";
                    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    ctx.letterSpacing = '1.5px';
                    ctx.fillText(dateText, dateChipX+32, dateChipY+dateChipH/2+1);
                    ctx.letterSpacing = '0px';
                    ctx.restore();

                    const pillW = 250, pillH = 62, pillX = PW-PADX-pillW, pillY = (HDR_H-pillH)/2, pillPad = 12, pillLogoSz = 40;
                    ctx.save();
                    ctx.shadowColor = isLight ? 'rgba(15,45,80,0.10)' : 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 14;
                    ctx.shadowOffsetY = 4;
                    ctx.fillStyle = clr.dateCardBg;
                    rr(ctx,pillX,pillY,pillW,pillH,18); ctx.fill();
                    ctx.restore();
                    ctx.save();
                    ctx.strokeStyle = accentSoft+'0.45)'; ctx.lineWidth = 1.5;
                    rr(ctx,pillX,pillY,pillW,pillH,18); ctx.stroke();
                    ctx.restore();
                    const lcx = pillX+pillPad, lcy = pillY+(pillH-pillLogoSz)/2;
                    if (logoImg) {
                        ctx.save();
                        ctx.beginPath(); rr(ctx,lcx,lcy,pillLogoSz,pillLogoSz,11); ctx.clip();
                        ctx.fillStyle = '#fff'; ctx.fillRect(lcx,lcy,pillLogoSz,pillLogoSz);
                        ctx.drawImage(logoImg,lcx,lcy,pillLogoSz,pillLogoSz);
                        ctx.restore();
                        ctx.strokeStyle = accentSoft+'0.6)'; ctx.lineWidth = 1.5;
                        rr(ctx,lcx,lcy,pillLogoSz,pillLogoSz,11); ctx.stroke();
                    }
                    const ptx = lcx+pillLogoSz+14;
                    ctx.fillStyle = clr.footerBrand;
                    ctx.font = "900 20px 'Nunito', sans-serif";
                    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    ctx.fillText('MuGöl', ptx, pillY+pillH/2-10);
                    ctx.fillStyle = accent;
                    ctx.font = "800 10px 'Nunito', sans-serif";
                    ctx.letterSpacing = '2.2px';
                    ctx.fillText('HAVA DURUMU', ptx, pillY+pillH/2+12);
                    ctx.letterSpacing = '0px';

                    // ── HERO: şehir adı, ikon, sıcaklık, açıklama, hissedilen, nem/rüzgar/basınç ──
                    let heroY = HDR_H;
                    ctx.save();
                    ctx.shadowColor = isLight ? 'rgba(15,45,80,0.14)' : 'rgba(0,0,0,0.35)';
                    ctx.shadowBlur = 26;
                    ctx.shadowOffsetY = 10;
                    ctx.fillStyle = clr.cardBg;
                    rr(ctx,PADX,heroY,PW-PADX*2,HERO_H,28); ctx.fill();
                    ctx.restore();
                    ctx.save();
                    ctx.strokeStyle = clr.cardBorder; ctx.lineWidth = 1.5;
                    rr(ctx,PADX,heroY,PW-PADX*2,HERO_H,28); ctx.stroke();
                    ctx.restore();
                    // Kartın üst kenarına ince parlaklık çizgisi — cam efekti hissi
                    ctx.save();
                    const heroShine = ctx.createLinearGradient(0,heroY,0,heroY+2);
                    heroShine.addColorStop(0, accentSoft+(isLight?'0.35)':'0.5)'));
                    heroShine.addColorStop(1, accentSoft+'0)');
                    ctx.strokeStyle = heroShine; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.moveTo(PADX+30,heroY+1); ctx.lineTo(PW-PADX-30,heroY+1); ctx.stroke();
                    ctx.restore();

                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';

                    // Şehir adı rozeti — hafif arka plan pill'i ile
                    ctx.font = "800 24px 'Nunito', sans-serif";
                    const cityLabel = `📍 ${d.city}`;
                    const cityLabelW = ctx.measureText(cityLabel).width;
                    ctx.save();
                    ctx.fillStyle = accentSoft+(isLight?'0.09)':'0.12)');
                    rr(ctx, PW/2-cityLabelW/2-20, heroY+18, cityLabelW+40, 40, 20); ctx.fill();
                    ctx.restore();
                    ctx.fillStyle = clr.cityName;
                    ctx.fillText(cityLabel, PW/2, heroY+30);

                    // Büyük hava ikonu — arkasında yumuşak ışık halesi
                    ctx.save();
                    const iconGlow = ctx.createRadialGradient(PW/2,heroY+108,10,PW/2,heroY+108,120);
                    iconGlow.addColorStop(0, accentSoft+(isLight?'0.14)':'0.20)'));
                    iconGlow.addColorStop(1, accentSoft+'0)');
                    ctx.fillStyle = iconGlow;
                    ctx.beginPath(); ctx.arc(PW/2,heroY+108,120,0,Math.PI*2); ctx.fill();
                    ctx.restore();
                    ctx.font = '92px sans-serif';
                    ctx.fillText(d.current.__icon || '☁️', PW/2, heroY+66);

                    // Sıcaklık — hafif dikey degrade ile derinlik
                    ctx.save();
                    const tempGrad = ctx.createLinearGradient(0,heroY+130,0,heroY+260);
                    tempGrad.addColorStop(0, clr.tempColor);
                    tempGrad.addColorStop(1, isLight ? '#2a4a63' : '#c9dcf0');
                    ctx.fillStyle = tempGrad;
                    ctx.font = "900 128px 'Nunito', sans-serif";
                    ctx.fillText(`${Math.round(d.current.temperature_2m)}°`, PW/2, heroY+168);
                    ctx.restore();

                    ctx.font = "600 20px 'Nunito', sans-serif";
                    ctx.fillStyle = clr.labelColor;
                    ctx.fillText(`Hissedilen: ${Math.round(d.current.feels_like)}°`, PW/2, heroY+282);

                    ctx.save();
                    ctx.shadowColor = accentSoft+'0.5)';
                    ctx.shadowBlur = 14;
                    ctx.font = "800 26px 'Nunito', sans-serif";
                    ctx.fillStyle = clr.descColor;
                    ctx.fillText(d.current.__desc || '', PW/2, heroY+312);
                    ctx.restore();

                    // alt istatistik şeridi: nem / rüzgar / basınç
                    const statW = (PW-PADX*2-32)/3, statY = heroY+380, statH = 76;
                    const stats = [
                        { icon:'💧', val:`${d.current.relative_humidity_2m}%`, label:'NEM' },
                        { icon:'💨', val:`${Math.round(d.current.wind_speed_10m)} km/s`, label:'RÜZGAR' },
                        { icon:'⏲', val:`${Math.round(d.current.pressure_msl)}`, label:'BASINÇ' },
                    ];
                    stats.forEach((s,i) => {
                        const sx = PADX+16+i*(statW+16);
                        ctx.save();
                        ctx.fillStyle = isLight ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.045)';
                        rr(ctx,sx,statY,statW,statH,14); ctx.fill();
                        ctx.strokeStyle = isLight ? 'rgba(15,45,80,0.06)' : 'rgba(255,255,255,0.06)';
                        ctx.lineWidth = 1;
                        rr(ctx,sx,statY,statW,statH,14); ctx.stroke();
                        ctx.restore();
                        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                        ctx.font = '26px sans-serif';
                        ctx.fillText(s.icon, sx+statW/2, statY+12);
                        ctx.font = "900 20px 'Nunito', sans-serif";
                        ctx.fillStyle = clr.cityName;
                        ctx.fillText(s.val, sx+statW/2, statY+42);
                        ctx.font = "700 11px 'Nunito', sans-serif";
                        ctx.fillStyle = clr.labelColor;
                        ctx.letterSpacing = '0.5px';
                        ctx.fillText(s.label, sx+statW/2, statY+64);
                        ctx.letterSpacing = '0px';
                    });

                    // ── SAATLİK TAHMİN ──
                    let secY = heroY+HERO_H+PADY_SEC;
                    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                    ctx.font = "900 24px 'Nunito', sans-serif";
                    ctx.fillStyle = clr.cityName;
                    ctx.fillText('🕒 Saatlik Tahmin', PADX, secY);

                    const hSectionTop = secY+44;
                    const hCount = Math.min(d.hourlyData.length, 8);
                    const hGap = 12;
                    const hCardW = (PW-PADX*2-hGap*(hCount-1))/hCount;
                    const hCardH = HOURLY_CARDS_H;
                    d.hourlyData.slice(0,hCount).forEach((h,i) => {
                        const hx = PADX+i*(hCardW+hGap);
                        ctx.save();
                        ctx.shadowColor = isLight ? 'rgba(15,45,80,0.08)' : 'rgba(0,0,0,0.28)';
                        ctx.shadowBlur = 12;
                        ctx.shadowOffsetY = 5;
                        ctx.fillStyle = clr.cardBg;
                        rr(ctx,hx,hSectionTop,hCardW,hCardH,16); ctx.fill();
                        ctx.restore();
                        ctx.save();
                        ctx.strokeStyle = clr.cardBorder; ctx.lineWidth = 1.2;
                        rr(ctx,hx,hSectionTop,hCardW,hCardH,16); ctx.stroke();
                        ctx.restore();
                        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                        ctx.font = "700 13px 'Nunito', sans-serif";
                        ctx.fillStyle = clr.labelColor;
                        ctx.fillText(h.time, hx+hCardW/2, hSectionTop+14);
                        ctx.font = '30px sans-serif';
                        ctx.fillText(h.icon, hx+hCardW/2, hSectionTop+40);
                        ctx.font = "900 19px 'Nunito', sans-serif";
                        ctx.fillStyle = clr.cityName;
                        ctx.fillText(`${h.temp}°`, hx+hCardW/2, hSectionTop+86);
                    });

                    // ── 5 GÜNLÜK TAHMİN ──
                    secY = hSectionTop+HOURLY_CARDS_H+PADY_SEC+GAP_BEFORE_SECTION;
                    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                    ctx.font = "900 24px 'Nunito', sans-serif";
                    ctx.fillStyle = clr.cityName;
                    ctx.fillText('📅 5 Günlük Tahmin', PADX, secY);

                    const dTop = secY+44;
                    ctx.save();
                    ctx.shadowColor = isLight ? 'rgba(15,45,80,0.08)' : 'rgba(0,0,0,0.28)';
                    ctx.shadowBlur = 16;
                    ctx.shadowOffsetY = 6;
                    ctx.fillStyle = clr.cardBg;
                    rr(ctx,PADX,dTop,PW-PADX*2,d.dailyData.length*DAILY_ROW_H,20); ctx.fill();
                    ctx.restore();
                    ctx.save();
                    ctx.strokeStyle = clr.cardBorder; ctx.lineWidth = 1.2;
                    rr(ctx,PADX,dTop,PW-PADX*2,d.dailyData.length*DAILY_ROW_H,20); ctx.stroke();
                    ctx.restore();

                    d.dailyData.forEach((day,i) => {
                        const ry = dTop+i*DAILY_ROW_H;
                        if (i>0) {
                            ctx.save();
                            ctx.strokeStyle = clr.cardBorder; ctx.lineWidth = 1;
                            ctx.beginPath(); ctx.moveTo(PADX+20,ry); ctx.lineTo(PW-PADX-20,ry); ctx.stroke();
                            ctx.restore();
                        }
                        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                        ctx.font = "800 20px 'Nunito', sans-serif";
                        ctx.fillStyle = clr.cityName;
                        ctx.fillText(day.date, PADX+28, ry+DAILY_ROW_H/2);
                        ctx.textAlign = 'center';
                        ctx.font = '30px sans-serif';
                        ctx.fillText(day.icon, PW/2-60, ry+DAILY_ROW_H/2+2);
                        ctx.textAlign = 'right';
                        ctx.save();
                        ctx.shadowColor = 'rgba(248,113,113,0.35)'; ctx.shadowBlur = 8;
                        ctx.font = "900 22px 'Nunito', sans-serif";
                        ctx.fillStyle = '#f87171';
                        ctx.fillText(`${day.maxTemp}°`, PW-PADX-90, ry+DAILY_ROW_H/2+8);
                        ctx.restore();
                        ctx.fillStyle = clr.labelColor;
                        ctx.font = "800 20px 'Nunito', sans-serif";
                        ctx.fillText('/', PW-PADX-64, ry+DAILY_ROW_H/2+7);
                        ctx.save();
                        ctx.shadowColor = 'rgba(96,165,250,0.35)'; ctx.shadowBlur = 8;
                        ctx.fillStyle = '#60a5fa';
                        ctx.font = "900 22px 'Nunito', sans-serif";
                        ctx.fillText(`${day.minTemp}°`, PW-PADX-24, ry+DAILY_ROW_H/2+8);
                        ctx.restore();
                    });

                    // ── DETAY KARTLARI: gündoğumu / günbatımı / UV / görüş / AQI ──
                    secY = dTop+d.dailyData.length*DAILY_ROW_H+PADY_SEC+GAP_BEFORE_SECTION;
                    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
                    ctx.font = "900 24px 'Nunito', sans-serif";
                    ctx.fillStyle = clr.cityName;
                    ctx.fillText('📋 Hava Detayları', PADX, secY);

                    const detailTop = secY+44;
                    const detailItems = [
                        { icon:'🌅', label:'GÜNEŞ DOĞUŞ', val: d.sunriseTime },
                        { icon:'🌇', label:'GÜNEŞ BATIŞ', val: d.sunsetTime },
                        { icon:'☀️', label:'UV İNDEKSİ', val: `${d.uvIndex} — ${d.uvLevel}` },
                        { icon:'👁️', label:'GÖRÜŞ MESAFESİ', val: d.visibilityKm },
                    ];
                    const dCols = 2, dGap = 12;
                    const dCardW = (PW-PADX*2-dGap)/dCols;
                    const dCardH = DETAIL_ROW_H;
                    detailItems.forEach((it,i) => {
                        const col = i%2, row = Math.floor(i/2);
                        const ix = PADX+col*(dCardW+dGap), iy = detailTop+row*(dCardH+dGap);
                        ctx.save();
                        ctx.shadowColor = isLight ? 'rgba(15,45,80,0.08)' : 'rgba(0,0,0,0.28)';
                        ctx.shadowBlur = 12;
                        ctx.shadowOffsetY = 5;
                        ctx.fillStyle = clr.cardBg;
                        rr(ctx,ix,iy,dCardW,dCardH,16); ctx.fill();
                        ctx.restore();
                        ctx.save();
                        ctx.strokeStyle = clr.cardBorder; ctx.lineWidth = 1.2;
                        rr(ctx,ix,iy,dCardW,dCardH,16); ctx.stroke();
                        ctx.restore();
                        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                        ctx.font = '30px sans-serif';
                        ctx.fillText(it.icon, ix+18, iy+dCardH/2);
                        ctx.font = "700 12px 'Nunito', sans-serif";
                        ctx.fillStyle = clr.labelColor;
                        ctx.letterSpacing = '0.4px';
                        ctx.fillText(it.label, ix+66, iy+dCardH/2-12);
                        ctx.letterSpacing = '0px';
                        ctx.font = "900 20px 'Nunito', sans-serif";
                        ctx.fillStyle = clr.cityName;
                        ctx.fillText(it.val, ix+66, iy+dCardH/2+12);
                    });

                    // ── ALT BİLGİ: oluşturulma saati + URL ──
                    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
                    ctx.fillStyle = clr.footerUrl;
                    ctx.font = "600 11px 'Nunito', sans-serif";
                    const saatStr = now.toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' });
                    ctx.fillText(`Oluşturuldu: ${saatStr}`, PW-PADX, TOTAL_H-14);
                    ctx.textAlign = 'left';
                    ctx.fillText('mugol-portal.github.io/mugol.havadurumu/', PADX, TOTAL_H-14);

                    // ── DIŞ ÇERÇEVE ──
                    ctx.save();
                    ctx.shadowColor = accentSoft+(isLight?'0.20)':'0.30)');
                    ctx.shadowBlur = 18;
                    ctx.strokeStyle = accentSoft+(isLight?'0.28)':'0.4)');
                    ctx.lineWidth = 3;
                    rr(ctx,3,3,PW-6,TOTAL_H-6,28); ctx.stroke();
                    ctx.restore();
                    ctx.save();
                    ctx.strokeStyle = isLight ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.08)';
                    ctx.lineWidth = 1;
                    rr(ctx,10,10,PW-20,TOTAL_H-20,22); ctx.stroke();
                    ctx.restore();

                    return fc.toDataURL('image/png');
                }

                // İkon/açıklamayı canvas fonksiyonunun kolay erişebilmesi için current objesine iliştir
                d.current.__icon = getWeatherIcon(d.current.weather_code);
                d.current.__desc = getWeatherDesc(d.current.weather_code);

                // ── ÖNİZLEME MODAL (bölgesel PNG ile aynı akış) ──
                let cityCurrentTheme = 'dark';

                function renderCityPreview() {
                    const dataUrl = drawCity(cityCurrentTheme);
                    const img = document.getElementById('city-png-preview-img');
