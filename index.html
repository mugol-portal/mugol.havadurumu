<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="HandheldFriendly" content="true">
    <meta name="MobileOptimized" content="375">
    <meta name="theme-color" content="#0c1f3f">
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MuGöl Hava">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./logo.png">

    <title>MuGöl Hava Durumu</title>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1880946354382681" crossorigin="anonymous"></script>

    <!-- AMP Auto Ads -->
    <script async custom-element="amp-auto-ads"
            src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js">
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0c1f3f;
            --bg-gradient: linear-gradient(160deg, #1a3a6b 0%, #0c2a5e 40%, #061830 100%);
            --glass-bg: rgba(14, 42, 90, 0.60);
            --glass-border: rgba(100, 180, 255, 0.12);
            --glass-shine: rgba(100, 180, 255, 0.06);
            --glass-shadow: 0 25px 50px -12px rgba(0, 10, 40, 0.7);
            --glass-inner-shadow: inset 0 0 0 1px rgba(100, 180, 255, 0.08);
            --text-primary: #e8f4ff;
            --text-secondary: #7eb8e8;
            --text-muted: #4a7fa8;
            --gold-primary: #38bdf8;
            --gold-metallic: linear-gradient(135deg, #7dd3fc 0%, #0ea5e9 100%);
            --gold-glow: rgba(56, 189, 248, 0.30);
            --radius-xl: 32px;
            --radius-lg: 20px;
            --radius-md: 14px;
            
            /* Alerts Colors */
            --alert-danger-bg: rgba(239, 68, 68, 0.15);
            --alert-danger-border: rgba(239, 68, 68, 0.3);
            --alert-warning-bg: rgba(245, 158, 11, 0.15);
            --alert-warning-border: rgba(245, 158, 11, 0.3);
            --alert-info-bg: rgba(59, 130, 246, 0.15);
            --alert-info-border: rgba(59, 130, 246, 0.3);
            --alert-success-bg: rgba(16, 185, 129, 0.15);
            --alert-success-border: rgba(16, 185, 129, 0.3);
            --alert-news-bg: rgba(139, 92, 246, 0.15);
            --alert-news-border: rgba(139, 92, 246, 0.3);
            
            /* Region Colors */
            --region-marmara: #3b82f6;
            --region-ege: #06b6d4;
            --region-akdeniz: #f97316;
            --region-ic: #f59e0b;
            --region-karadeniz: #10b981;
            --region-dogu: #8b5cf6;
            --region-guneydogu: #ef4444;
        }

        body.light-mode {
            --bg-dark: #f8fafc;
            --bg-gradient: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.04);
            --glass-shine: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.05);
            --glass-inner-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --gold-primary: #d97706;
            --gold-metallic: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            --gold-glow: rgba(217, 119, 6, 0.15);
            
            /* Alerts Colors Light */
            --alert-danger-bg: rgba(239, 68, 68, 0.08);
            --alert-warning-bg: rgba(245, 158, 11, 0.08);
            --alert-info-bg: rgba(59, 130, 246, 0.08);
            --alert-success-bg: rgba(16, 185, 129, 0.08);
            --alert-news-bg: rgba(139, 92, 246, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-dark);
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: background 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .ambient-light {
            position: fixed; top: -20vh; left: -20vw; width: 80vw; height: 80vw;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, transparent 70%);
            filter: blur(60px); z-index: -1; animation: breathe 10s infinite alternate;
        }
        .ambient-light-2 {
            position: fixed; bottom: -15vh; right: -15vw; width: 70vw; height: 70vw;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.10) 0%, transparent 70%);
            filter: blur(80px); z-index: -1; animation: breathe 14s 3s infinite alternate;
        }
        body.light-mode .ambient-light-2 { background: radial-gradient(circle, rgba(14, 165, 233, 0.06) 0%, transparent 70%); }
        @keyframes breathe { 0% { opacity: 0.5; transform: scale(1); } 100% { opacity: 0.9; transform: scale(1.12); } }

        .container { max-width: 440px; margin: 0 auto; padding: 16px 20px 110px 20px; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-top: 20px; }
        .brand-wrapper { display: flex; align-items: center; gap: 12px; }
        
        .logo-box { 
            width: 48px; height: 48px; border-radius: 14px; background: rgba(0, 0, 0, 0.3); 
            border: 1.5px solid rgba(255, 255, 255, 0.9); display: flex; align-items: center; 
            justify-content: center; overflow: hidden; padding: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }
        body.light-mode .logo-box { border-color: rgba(0, 0, 0, 0.8); background: rgba(255, 255, 255, 0.5); }
        .logo-box img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }

        .brand-text h1 { font-size: 1.35rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1; background: var(--gold-metallic); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-text p { font-size: 0.68rem; color: var(--text-secondary); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
        
        .control-group { display: flex; gap: 10px; }
        .icon-btn { width: 44px; height: 44px; border-radius: var(--radius-md); border: none; background: var(--glass-bg); box-shadow: var(--glass-inner-shadow); border: 1px solid var(--glass-border); color: var(--text-primary); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); font-size: 1.1rem; }
        .icon-btn:hover { background: var(--glass-shine); transform: translateY(-2px); border-color: var(--gold-primary); }
        .icon-btn.active { background: var(--gold-metallic); color: #0a1628; box-shadow: 0 8px 20px var(--gold-glow); border-color: transparent; }

        /* TABS (KATEGORİ BANNERI EN ÜSTTE) */
        .tabs-dock { display: flex; background: var(--glass-bg); border-radius: var(--radius-lg); padding: 5px; gap: 6px; margin-bottom: 16px; box-shadow: var(--glass-shadow), var(--glass-inner-shadow); border: 1px solid var(--glass-border); backdrop-filter: blur(20px); }
        .tab-btn { flex: 1; padding: 11px 4px; border: none; background: transparent; color: var(--text-secondary); font-weight: 800; font-size: 0.82rem; font-family: 'Nunito', sans-serif; border-radius: 15px; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); letter-spacing: 0.01em; }
        .tab-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }
        .tab-btn.active { background: var(--gold-metallic); color: #0a1628; box-shadow: 0 4px 14px var(--gold-glow); }
        
        .tab-pane { display: none; animation: hero-enter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .tab-pane.active { display: block; }

        /* SEARCH DOCK (SADECE HAVA DURUMU BÖLÜMÜNDE) */
        .search-dock { background: var(--glass-bg); border-radius: var(--radius-lg); padding: 6px; display: flex; gap: 8px; margin-bottom: 24px; box-shadow: var(--glass-shadow), var(--glass-inner-shadow); border: 1px solid var(--glass-border); backdrop-filter: blur(20px); align-items: center; height: 56px; }
        .select-group { flex: 1; position: relative; height: 100%; }
        .city-select { width: 100%; height: 100%; padding: 0 16px; border: none; background: transparent; color: var(--text-primary); font-size: 0.95rem; font-weight: 600; font-family: inherit; appearance: none; outline: none; cursor: pointer; }
        .city-select option { background: #0c1f3f; color: white; padding: 10px; }
        body.light-mode .city-select option { background: white; color: black; }
        .select-indicator { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; background: rgba(255,255,255,0.05); border-radius: 6px; display: flex; align-items: center; justify-content: center; pointer-events: none; color: var(--text-secondary); font-size: 0.7rem; }
        
        .action-btn { width: 42px; height: 42px; border-radius: var(--radius-md); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 1.1rem; flex-shrink: 0; }
        .btn-ghost { background: transparent; color: var(--text-secondary); }
        .btn-ghost:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
        .btn-gold { background: var(--gold-metallic); color: #0a1628; box-shadow: 0 4px 12px var(--gold-glow); }
        .btn-gold:hover { transform: scale(1.05); }

        /* HERO CARD */
        .weather-hero { background: var(--glass-bg); border-radius: var(--radius-xl); padding: 32px 24px; text-align: center; position: relative; overflow: hidden; box-shadow: var(--glass-shadow), var(--glass-inner-shadow); border: 1px solid var(--glass-border); margin-bottom: 24px; animation: hero-enter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); transition: background 0.6s; }
        .weather-hero::before { content: ''; position: absolute; inset: 0; border-radius: var(--radius-xl); padding: 1px; background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent 80%); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; pointer-events: none; }
        .weather-hero.hero-sunny::after { content: ''; position: absolute; top: -30%; right: -10%; width: 60%; height: 60%; background: radial-gradient(circle, rgba(56,189,248,0.20) 0%, transparent 70%); pointer-events: none; animation: breathe 8s infinite alternate; }
        .weather-hero.hero-rain::after { content: ''; position: absolute; top: -20%; left: 10%; width: 80%; height: 80%; background: radial-gradient(circle, rgba(59,130,246,0.18) 0%, transparent 70%); pointer-events: none; animation: breathe 10s infinite alternate; }
        .weather-hero.hero-snow::after { content: ''; position: absolute; top: -20%; left: 10%; width: 80%; height: 80%; background: radial-gradient(circle, rgba(186,230,253,0.2) 0%, transparent 70%); pointer-events: none; animation: breathe 10s infinite alternate; }
        .weather-hero.hero-storm::after { content: ''; position: absolute; top: -20%; left: 10%; width: 80%; height: 80%; background: radial-gradient(circle, rgba(124,58,237,0.18) 0%, transparent 70%); pointer-events: none; animation: breathe 6s infinite alternate; }
        .hero-icon { font-size: 88px; margin-bottom: 8px; display: inline-block; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.3)); animation: float 6s ease-in-out infinite; position: relative; z-index: 1; }
        .hero-temp { font-size: 4.8rem; font-weight: 900; line-height: 1; letter-spacing: -4px; background: linear-gradient(180deg, var(--text-primary) 30%, rgba(255,255,255,0.4) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; position: relative; z-index: 1; }
        body.light-mode .hero-temp { background: linear-gradient(180deg, var(--text-primary) 30%, rgba(0,0,0,0.4) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .hero-feels { font-size: 0.88rem; color: var(--text-secondary); font-weight: 600; margin-bottom: 6px; position: relative; z-index: 1; }
        .hero-desc { font-size: 1.05rem; font-weight: 800; color: var(--gold-primary); text-transform: capitalize; margin-bottom: 22px; letter-spacing: 0.3px; position: relative; z-index: 1; }
        .hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: rgba(0,0,0,0.2); border-radius: var(--radius-lg); padding: 4px; border: 1px solid var(--glass-border); position: relative; z-index: 1; }
        body.light-mode .hero-stats { background: rgba(255,255,255,0.3); }
        .stat-box { padding: 12px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .stat-icon { font-size: 1.15rem; filter: grayscale(0.3); }
        .stat-val { font-size: 0.9rem; font-weight: 800; color: var(--text-primary); }
        .stat-label { font-size: 0.62rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }
        .loc-tag { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.07); padding: 5px 12px; border-radius: 100px; font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); border: 1px solid var(--glass-border); display: flex; align-items: center; gap: 4px; z-index: 2; backdrop-filter: blur(8px); }
        
        /* UV & Extra detail */
        .uv-bar { height: 5px; border-radius: 100px; background: linear-gradient(90deg, #22c55e, #eab308, #ef4444); margin-top: 4px; position: relative; }
        .uv-dot { position: absolute; top: -3px; width: 11px; height: 11px; background: white; border-radius: 50%; border: 2px solid #061830; transform: translateX(-50%); box-shadow: 0 2px 6px rgba(0,0,0,0.4); transition: left 0.5s cubic-bezier(0.34,1.56,0.64,1); }

        /* SECTIONS & TITLES */
        .section-head { display: flex; align-items: center; justify-content: space-between; margin: 28px 4px 14px; }
        .section-title { font-size: 0.95rem; font-weight: 900; color: var(--text-primary); letter-spacing: -0.01em; }
        .section-icon { color: var(--gold-primary); margin-right: 6px; font-size: 1rem; }
        
        /* NEWS & ALERTS */
        .alert-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .alert-card { background: var(--glass-bg); border-radius: var(--radius-lg); padding: 16px; display: flex; gap: 14px; align-items: center; border: 1px solid var(--glass-border); box-shadow: var(--glass-inner-shadow); position: relative; overflow: hidden; transition: transform 0.2s; text-decoration: none; }
        .alert-card:hover { transform: translateY(-2px); }
        .alert-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
        
        .alert-danger { background: var(--alert-danger-bg); border-color: var(--alert-danger-border); }
        .alert-danger::before { background: #ef4444; }
        .alert-warning { background: var(--alert-warning-bg); border-color: var(--alert-warning-border); }
        .alert-warning::before { background: #f59e0b; }
        .alert-info { background: var(--alert-info-bg); border-color: var(--alert-info-border); }
        .alert-info::before { background: #3b82f6; }
        .alert-success { background: var(--alert-success-bg); border-color: var(--alert-success-border); }
        .alert-success::before { background: #10b981; }
        .alert-news { background: var(--alert-news-bg); border-color: var(--alert-news-border); }
        .alert-news::before { background: #8b5cf6; }

        .alert-icon { font-size: 1.8rem; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
        .alert-content { display: flex; flex-direction: column; gap: 4px; }
        .alert-title { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); line-height: 1.3; }
        .alert-desc { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.4; font-weight: 600; }
        
        .news-badge { display: inline-block; background: #8b5cf6; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; margin-bottom: 4px; width: fit-content; text-transform: uppercase;}

        /* DETAILS GRID */
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
        .detail-card { background: var(--glass-bg); border-radius: var(--radius-lg); padding: 16px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--glass-border); box-shadow: var(--glass-inner-shadow); transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), border-color 0.2s, box-shadow 0.2s; }
        .detail-card:hover { transform: translateY(-4px) scale(1.01); background: var(--glass-shine); border-color: var(--gold-primary); box-shadow: 0 12px 30px rgba(56,189,248,0.15); }
        .detail-icon { font-size: 1.7rem; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); flex-shrink: 0; }
        .detail-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .detail-label { font-size: 0.68rem; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-val { font-size: 1rem; font-weight: 900; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .detail-sub { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }

        /* SCROLL WRAP & FORECAST */
        .scroll-wrap { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 20px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .scroll-wrap::-webkit-scrollbar { display: none; }
        .hour-pill { min-width: 74px; background: var(--glass-bg); border-radius: var(--radius-lg); padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; border: 1px solid var(--glass-border); box-shadow: var(--glass-inner-shadow); transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), border-color 0.2s; }
        .hour-pill:hover { transform: translateY(-5px); border-color: var(--gold-primary); box-shadow: 0 10px 25px rgba(56,189,248,0.18); }
        .hour-pill.current { border-color: var(--gold-primary); background: linear-gradient(180deg, rgba(251,191,36,0.12), var(--glass-bg)); }
        .hp-time { font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); }
        .hp-icon { font-size: 1.6rem; }
        .hp-temp { font-size: 0.95rem; font-weight: 800; color: var(--text-primary); }
        
        .daily-grid { display: flex; flex-direction: column; gap: 7px; }
        .day-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; border-radius: var(--radius-lg); background: var(--glass-bg); border: 1px solid var(--glass-border); box-shadow: var(--glass-inner-shadow); transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1); }
        .day-row:hover { background: var(--glass-shine); transform: scale(1.015) translateX(3px); border-color: rgba(251,191,36,0.35); }
        .dr-name { flex: 1; font-weight: 700; font-size: 0.88rem; color: var(--text-secondary); }
        .dr-icon { font-size: 1.3rem; margin: 0 14px; }
        .dr-vals { font-weight: 900; font-size: 1rem; color: var(--text-primary); }
        .dr-low { color: var(--text-muted); font-weight: 600; font-size: 0.83rem; margin-left: 6px; }

        /* SATELLITE/RADAR MAP */
        .map-container { width: 100%; height: 350px; border-radius: var(--radius-xl); overflow: hidden; border: 1px solid var(--glass-border); box-shadow: var(--glass-inner-shadow), var(--glass-shadow); background: var(--glass-bg); margin-bottom: 24px; position: relative; z-index: 1; transform: translateZ(0); }
        .map-container iframe { width: 100%; height: 100%; border: none; display: block; transition: filter 0.3s ease; }
        body:not(.light-mode) .map-container iframe { filter: brightness(0.9) contrast(1.1); }

        /* LOADING & ALERTS */
        .loading-wrap { padding: 50px; text-align: center; }
        .gold-spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--gold-primary); border-radius: 50%; animation: spin 0.8s ease-in-out infinite; margin: 0 auto 12px; }
        
        .pwa-toast { position: fixed; bottom: 24px; left: 20px; right: 20px; background: rgba(8, 25, 60, 0.97); border: 1px solid var(--gold-primary); backdrop-filter: blur(20px); border-radius: 20px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; transform: translateY(150%); transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1); z-index: 2000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        body.light-mode .pwa-toast { background: rgba(255,255,255,0.95); }
        .pwa-toast.show { transform: translateY(0); }
        .toast-btn { background: var(--gold-metallic); color: #061830; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }

        @keyframes hero-enter { from { opacity: 0; transform: scale(0.95) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .pulse-gold { animation: pulse 1s infinite; background: var(--gold-metallic) !important; color: #000 !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        /* ─── BÖLGESEL HAVA DURUMU ─── */
        .bolge-intro { background: var(--glass-bg); border-radius: var(--radius-xl); padding: 22px 24px; text-align: center; margin-bottom: 20px; border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow), var(--glass-inner-shadow); position: relative; overflow: hidden; animation: hero-enter 0.7s cubic-bezier(0.2,0.8,0.2,1); }
        .bolge-intro::after { content: ''; position: absolute; top: -30%; right: -10%; width: 60%; height: 110%; background: radial-gradient(circle, rgba(56,189,248,0.12) 0%, transparent 70%); pointer-events: none; }
        .bolge-intro h2 { font-size: 1.35rem; font-weight: 900; background: var(--gold-metallic); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.03em; margin-bottom: 4px; }
        .bolge-intro p { font-size: 0.78rem; color: var(--text-secondary); font-weight: 600; }

        async function fetchRealWeatherNews() {
            try {
                // Türkiye geneli daha çok hava durumu haberi çekmek için anahtar kelimeler genişletildi
                const query = encodeURIComponent('("hava durumu" OR meteoroloji OR sağanak OR fırtına OR kar OR "AKOM" OR "AFAD" OR "MGM") when:1d');
                const rssUrl = `https://news.google.com/rss/search?q=${query}&hl=tr&gl=TR&ceid=TR:tr`;
                const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (data.status === 'ok' && data.items.length > 0) {
                    // Kaynak sayısını (8 habere kadar) artırdık.
                    return data.items.slice(0, 8).map(item => {
                        let fullTitle = item.title;
                        let source = fullTitle.split(' - ').pop();
                        let cleanTitle = fullTitle.replace(' - ' + source, '');
                        return { title: cleanTitle, source: source || 'Haber Ajansı', link: item.link, pubDate: new Date(item.pubDate).toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'}) };
                    });
                }
                return[];
            } catch (e) { return[]; }

                localAlerts.push({ type: 'danger', icon: '🔥', title: 'Aşırı Sıcaklık Uyarısı', desc: 'Sıcak çarpması riskine karşı öğle saatlerinde mecbur kalmadıkça dışarı çıkmayın.' });
            } else if (current.temperature_2m <= 0) {
                localAlerts.push({ type: 'info', icon: '❄️', title: 'Don ve Buzlanma', desc: 'Düşük sıcaklıklar sebebiyle bölgenizde yollarda gizli buzlanma görülebilir.' });
            }

            if (current.wind_speed_10m > 50) {
                localAlerts.push({ type: 'warning', icon: '🌪️', title: 'Kuvvetli Fırtına Uyarısı', desc: 'Çatı uçması ve ağaç devrilmelerine karşı açık alanlarda tedbirli olun.' });
            }

            if (current.weather_code === 95) {
                 localAlerts.push({ type: 'danger', icon: '⛈️', title: 'Gök Gürültülü Sağanak', desc: 'Yıldırım, ani sel ve yerel dolu yağışına karşı bulunduğunuz bölgede dikkatli olun.' });
            }

            if (localAlerts.length === 0) {
                localAlerts.push({ type: 'success', icon: '✅', title: 'Sakin ve Güvenli', desc: 'Şu an için konumunuzda olağanüstü bir meteorolojik risk bulunmamaktadır.' });
            }

            localAlerts.forEach(alert => {
                html += `
                <div class="alert-card alert-${alert.type}">
                    <div class="alert-icon">${alert.icon}</div>
                    <div class="alert-content">
                        <span class="alert-title">${alert.title}</span>
                        <span class="alert-desc">${alert.desc}</span>
                    </div>
                </div>`;
            });

            // GERÇEK AJANS HABERLERİ
            if (realNews && realNews.length > 0) {
                html += `
                <div style="margin: 24px 0 12px 0;">
                    <span style="font-size:0.85rem; font-weight:800; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px;">Son Dakika Türkiye Haberleri</span>
                </div>`;
                
                realNews.forEach(news => {
                    html += `
                    <a href="${news.link}" target="_blank" class="alert-card alert-news">
                        <div class="alert-icon">📰</div>
                        <div class="alert-content">
                            <span class="news-badge">${news.source}</span>
                            <span class="alert-title">${news.title}</span>
                            <span class="alert-desc">Yayınlanma: Bugün ${news.pubDate}</span>
                        </div>
                    </a>`;
                });
            }

            return html;
        }

        async function getCityNameFromCoords(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=tr&zoom=18`, { headers: { 'User-Agent': 'MuGol-Hava-Durumu' } });
                const data = await response.json();
                const addr = data.address || {};

                const mahalle = addr.neighbourhood || addr.suburb || addr.quarter || '';
                const ilce = addr.town || addr.district || addr.county || '';
                const il = addr.province || addr.city || '';

                const parts =[];
                if (mahalle) parts.push(mahalle);
                if (ilce) parts.push(ilce);
                if (parts.length === 0 && il) parts.push(il);

                return parts.length > 0 ? parts.join(', ') : 'Konumunuz';
            } catch { return 'Konumunuz'; }
        }

        async function fetchWeatherData(lat, lon, cityName = null) {
            const meteoUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
                `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,surface_pressure` +
                `&hourly=temperature_2m,weather_code` +
                `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset` +
                `&timezone=auto&forecast_days=5`;

            const [meteoRes, realNews] = await Promise.all([
                fetch(meteoUrl),
                fetchRealWeatherNews()
            ]);

            if (!meteoRes.ok) throw new Error('API hatası');
            const d = await meteoRes.json();

            // Güncel saate en yakın hourly index
            const nowIso = d.current.time;
            const hourlyTimes = d.hourly.time;

            const data = {
                current: {
                    temperature_2m: d.current.temperature_2m,
                    feels_like: d.current.apparent_temperature,
                    relative_humidity_2m: d.current.relative_humidity_2m,
                    weather_code: d.current.weather_code,
                    wind_speed_10m: d.current.wind_speed_10m,
                    pressure_msl: d.current.surface_pressure,
                    visibility: 10000,
                    sunrise: new Date(d.daily.sunrise[0]).getTime() / 1000,
                    sunset:  new Date(d.daily.sunset[0]).getTime()  / 1000,
                    aqi: null
                },
                hourly: {
                    time: hourlyTimes,
                    temperature_2m: d.hourly.temperature_2m,
                    weather_code: d.hourly.weather_code
                },
                daily: {
                    time: d.daily.time,
                    weather_code: d.daily.weather_code,
                    temperature_2m_max: d.daily.temperature_2m_max,
                    temperature_2m_min: d.daily.temperature_2m_min
                },
                news: realNews
            };

            const city = cityName || await getCityNameFromCoords(lat, lon);
            return { city, data, lat, lon };
        }

        async function getLocationWeather() {
            if (!navigator.geolocation) return showError('Konum desteklenmiyor.');
            locationBtn.classList.add('pulse-gold');
            try {
                const position = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000 });
                });
                currentLat = position.coords.latitude; currentLon = position.coords.longitude; isUsingLocation = true;
                showLoading();
                const weatherData = await fetchWeatherData(currentLat, currentLon);
                displayWeather(weatherData);
                citySelect.value = '';
                if (notificationBtn.classList.contains('active')) {
                    await showWeatherNotification(weatherData.data, weatherData.city);
                }
            } catch (e) { showError('Konum alınamadı.'); }
            finally { locationBtn.classList.remove('pulse-gold'); }
        }

        function formatTime(unixTimestamp) {
            const date = new Date(unixTimestamp * 1000);
            return date.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        }

        function displayWeather({ city, data, lat, lon }) {
            const { current, hourly, daily, news } = data;
            const hourlyData =[];[0, 3, 6, 9, 12, 15, 18, 21, 24].forEach(slot => {
                const target = new Date(); target.setHours(slot === 24 ? 0 : slot, 0, 0, 0);
                if (slot === 24) target.setDate(target.getDate() + 1);
                const closest = hourly.time.reduce((best, time, i) => {
                    const diff = Math.abs(new Date(time) - target);
                    return diff < best.diff ? { i, diff } : best;
                }, { i: -1, diff: Infinity });
                if (closest.i !== -1) hourlyData.push({
                    time: `${String(slot).padStart(2, '0')}:00`,
                    temp: Math.round(hourly.temperature_2m[closest.i]),
                    icon: getWeatherIcon(hourly.weather_code[closest.i])
                });
            });

            const dailyData = Array.from({ length: 5 }, (_, i) => ({
                date: new Date(daily.time[i]).toLocaleDateString('tr-TR', { weekday: 'short', day: 'numeric' }),
                maxTemp: Math.round(daily.temperature_2m_max[i]),
                minTemp: Math.round(daily.temperature_2m_min[i]),
                icon: getWeatherIcon(daily.weather_code[i])
            }));

            const sunriseTime = formatTime(current.sunrise);
            const sunsetTime = formatTime(current.sunset);
            const visibilityKm = current.visibility ? (current.visibility / 1000).toFixed(1) + ' km' : 'Bilinmiyor';
            const aqiObj = current.aqi ? getAqiText(current.aqi) : { text: 'Bilinmiyor', icon: '⚪' };
            
            // Hero class based on weather type
            const heroClass = current.weather_code >= 95 ? 'hero-storm' : current.weather_code >= 70 ? 'hero-snow' : current.weather_code >= 60 ? 'hero-rain' : current.weather_code >= 1 ? '' : 'hero-sunny';
            
            // UV index estimate (based on time & weather)
            const now = new Date();
            const hour = now.getHours();
            let uvBase = current.weather_code === 0 ? 8 : current.weather_code <= 2 ? 5 : current.weather_code <= 3 ? 3 : 1;
            if (hour < 8 || hour > 19) uvBase = 0;
            else if (hour < 10 || hour > 16) uvBase = Math.round(uvBase * 0.5);
            const uvIndex = Math.min(11, uvBase);
            const uvLevel = uvIndex <= 2 ? 'Düşük' : uvIndex <= 5 ? 'Orta' : uvIndex <= 7 ? 'Yüksek' : uvIndex <= 10 ? 'Çok Yüksek' : 'Aşırı';
            const uvPct = Math.round((uvIndex / 11) * 100);

            // Aktif Tab'ı hatırla (Yenileme yapıldığında doğru sayfada kalması için)
            const activeTabBtn = document.querySelector('.tab-btn.active');

            weatherContent.innerHTML = `

                        <div class="hero-temp">${Math.round(current.temperature_2m)}°</div>
                        <div class="hero-feels">Hissedilen: ${Math.round(current.feels_like)}°</div>
                        <div class="hero-desc">${getWeatherDesc(current.weather_code)}</div>
                        <div class="hero-stats">
                            <div class="stat-box"><span class="stat-icon">💧</span><span class="stat-val">${current.relative_humidity_2m}%</span><span class="stat-label">Nem</span></div>
                            <div class="stat-box"><span class="stat-icon">💨</span><span class="stat-val">${Math.round(current.wind_speed_10m)} km/s</span><span class="stat-label">Rüzgar</span></div>
                            <div class="stat-box"><span class="stat-icon">⏲</span><span class="stat-val">${Math.round(current.pressure_msl)}</span><span class="stat-label">Basınç</span></div>
                        </div>
                    </div>

                    <div class="section-head"><span class="section-title">Hava Detayları</span><span class="section-icon">📋</span></div>
                    <div class="details-grid">
                        <div class="detail-card">
                            <div class="detail-icon">🌅</div>
                            <div class="detail-info">
                                <span class="detail-label">Güneş Doğuş</span>
                                <span class="detail-val">${sunriseTime}</span>
                            </div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-icon">🌇</div>
                            <div class="detail-info">
                                <span class="detail-label">Güneş Batış</span>
                                <span class="detail-val">${sunsetTime}</span>
                            </div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-icon">☀️</div>
                            <div class="detail-info">
                                <span class="detail-label">UV İndeksi</span>
                                <span class="detail-val">${uvIndex} — ${uvLevel}</span>
                                <div class="uv-bar" style="width:100px;"><div class="uv-dot" style="left:${uvPct}%"></div></div>
                            </div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-icon">👁️</div>
                            <div class="detail-info">
                                <span class="detail-label">Görüş Mesafesi</span>
                                <span class="detail-val">${visibilityKm}</span>
                            </div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-icon">${aqiObj.icon}</div>
                            <div class="detail-info">
                                <span class="detail-label">Hava Kalitesi</span>
                                <span class="detail-val">${aqiObj.text}</span>
                            </div>
                        </div>
                    </div>

                    <div class="section-head"><span class="section-title">Saatlik Tahmin</span><span class="section-icon">🕒</span></div>
                    <div class="scroll-wrap">
                        ${hourlyData.map(h => `<div class="hour-pill"><div class="hp-time">${h.time}</div><div class="hp-icon">${h.icon}</div><div class="hp-temp">${h.temp}°</div></div>`).join('')}
                    </div>
                    
                    <div class="section-head"><span class="section-title">5 Günlük Tahmin</span><span class="section-icon">📅</span></div>
                    <div class="daily-grid">
                        ${dailyData.map(d => `<div class="day-row"><div class="dr-name">${d.date}</div><div class="dr-icon">${d.icon}</div><div class="dr-vals">${d.maxTemp}° <span class="dr-low">${d.minTemp}°</span></div></div>`).join('')}
                    </div>

                    <div class="section-head"><span class="section-title">Uydu & Radar</span><span class="section-icon">📡</span></div>
                    <div class="map-container">
                        <iframe src="https://embed.windy.com/embed2.html?lat=${lat}&lon=${lon}&zoom=6&level=surface&overlay=clouds&menu=&message=true&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&detailLat=${lat}&detailLon=${lon}&metricWind=km%2Fh&metricTemp=%C2%B0C&radarRange=-1" loading="lazy"></iframe>
                    </div>

                </div>

                <!-- SEKME 2: HABERLER VE UYARILAR -->
                <div class="tab-pane ${activeTab === 'news' ? 'active' : ''}" id="pane-news">
                    
                    <div class="weather-hero" style="padding: 24px;">
                        <div style="font-size: 3.5rem; margin-bottom: 12px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));">📰</div>
                        <h2 style="font-size: 1.35rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px;">Gündem & Son Dakika</h2>
                        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 6px; font-weight: 500;">Bölgesel Analizler ve Canlı Türkiye Gündemi</p>
                    </div>

                    <div class="alert-container">
                        ${generateWeatherAlerts(current, news)}

                </div>
            `;
        }

        function showLoading() { weatherContent.innerHTML = `<div class="weather-hero"><div class="loading-wrap"><div class="gold-spinner"></div><p style="color:var(--text-secondary)">Meteorolojik veriler taranıyor...</p></div></div>`; }

        async function fetchCityWeatherSimple(cityName) {
            try {
                const [lat, lon] = cityCoords[cityName];
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
                const res = await fetch(url);
                if (!res.ok) return null;
                const d = await res.json();
                const code = d.current.weather_code;
                return {
                    city: cityName,
                    temp: Math.round(d.current.temperature_2m),
                    code: code,
                    icon: getWeatherIcon(code),
                    desc: getWeatherDesc(code)
                };
            } catch { return null; }
        }

        async function loadRegionalWeather() {
            const bolgeContent = document.getElementById('bolgeContent');
            bolgeContent.innerHTML = `<div class="loading-wrap"><div class="gold-spinner"></div><p style="color:var(--text-secondary);font-size:0.85rem;margin-top:8px;">Tüm iller yükleniyor…</p></div>`;

            for (let ri = 0; ri < REGIONS.length; ri++) {

                html += `
                <div class="bolge-region" style="${delayStyle}">
                    <div class="bolge-region-card">
                        <div class="bolge-region-header">
                            <div class="bolge-region-bar" style="background:${region.color};box-shadow:0 0 10px ${region.color}60;"></div>
                            <div class="bolge-region-label">
                                <div class="bolge-region-name">${region.emoji} ${region.name}</div>
                                <div class="bolge-region-sub">${region.cities.length} il · anlık güncelleme</div>
                            </div>

                        </div>
                        <div class="bolge-city-list" id="region-${ri}">${skeletons}</div>
                    </div>
                </div>`;
            }
            bolgeContent.innerHTML = html;

            REGIONS.forEach(async (region, ri) => {
                const results = await Promise.all(region.cities.map(c => fetchCityWeatherSimple(c)));
                const container = document.getElementById(`region-${ri}`);

                container.innerHTML = results.map((r, i) => {

        function switchToCity(cityName) {
            // Switch to weather tab
            tabBtns.forEach(b => b.classList.remove('active'));
            const weatherTab = document.querySelector('[data-tab="weather"]');
            if (weatherTab) weatherTab.classList.add('active');
            document.getElementById('searchDock').style.display = 'flex';
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            const paneWeather = document.getElementById('pane-weather');
            if (paneWeather) paneWeather.classList.add('active');
            // Set city and load
            citySelect.value = cityName;
            isUsingLocation = false;
            loadWeather();
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function loadWeather() {
            if (!citySelect.value) return showError('Şehir seçin.');
            isUsingLocation = false; showLoading();
            try {
                const [lat, lon] = cityCoords[citySelect.value];
                const weatherData = await fetchWeatherData(lat, lon, citySelect.value);
                displayWeather(weatherData);
                if (notificationBtn.classList.contains('active')) {
                    await showWeatherNotification(weatherData.data, weatherData.city);
                }
            } catch { showError('Ağ bağlantınızı kontrol edip tekrar deneyin.'); }
        }

        async function refreshWeather() {
            refreshBtn.classList.add('loading');
            if (isUsingLocation && currentLat) {
                try { 
                    showLoading(); 
                    const wd = await fetchWeatherData(currentLat, currentLon);
                    displayWeather(wd); 
                } catch { showError('Hata oluştu.'); }
            } else if (citySelect.value) {
                await loadWeather();
            }
            setTimeout(() => refreshBtn.classList.remove('loading'), 1000);
        }

        // --- SEKME (TAB) GEÇİŞ MEKANİZMASI ---
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Aktif butonu değiştir

                btn.classList.add('active');
                
                const target = btn.dataset.tab;
                const searchDock = document.getElementById('searchDock');
                
                // Şehir arama çubuğunu SADECE Hava Durumu panelindeyken göster
                if (target === 'weather') {
                    searchDock.style.display = 'flex';
                } else {
                    searchDock.style.display = 'none';
                }

                // İçeriği değiştir
                document.querySelectorAll('.tab-pane').forEach(pane => {
                    pane.classList.remove('active');
                });
                
                const targetPane = document.getElementById(`pane-${target}`);
                if (targetPane) {
                    targetPane.classList.add('active');
                }
                
                // Bölgeler tabı açıldığında lazy load
                if (target === 'bolge' && !bolgeLoaded) {
                    loadRegionalWeather();
                    bolgeLoaded = true;
                }
            });
        });

        searchBtn.addEventListener('click', loadWeather);
        refreshBtn.addEventListener('click', refreshWeather);
        citySelect.addEventListener('change', loadWeather);
        locationBtn.addEventListener('click', getLocationWeather);

        let dark = true;
        themeToggle.addEventListener('click', () => {
            dark = !dark; document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', dark ? 'dark' : 'light');
        });

        // --- PWA KURULUM ve SERVICE WORKER KAYDI ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => { 
            e.preventDefault(); 
            deferredPrompt = e; 
            setTimeout(() => document.getElementById('installPrompt').classList.add('show'), 3000); 
        });
        
        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
            document.getElementById('installPrompt').classList.remove('show');
        });
        document.getElementById('dismissBtn').addEventListener('click', () => document.getElementById('installPrompt').classList.remove('show'));

        let swReg = null;
        async function registerSW() {
            if ('serviceWorker' in navigator) {
                try { swReg = await navigator.serviceWorker.register('./sw.js'); return true; } 
                catch (e) { return false; }
            }
            return false;
        }

        window.addEventListener('load', registerSW);

        notificationBtn.addEventListener('click', async () => {
            if (!('Notification' in window)) return alert('Cihazınız bildirimleri desteklemiyor.');

            if (Notification.permission === 'granted') {
                toggleNotificationState();
            } else if (Notification.permission !== 'denied') {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    toggleNotificationState();
                }
            }
        });

        function toggleNotificationState() {
            notificationBtn.classList.toggle('active');
            if (notificationBtn.classList.contains('active')) {
                startNotificationLoop();
                alert('Bildirimler açıldı. 30 dakikada bir güncelleme alacaksınız.');
            } else {
                stopNotificationLoop();
            }
        }

        function startNotificationLoop() {
            refreshWeather();
            if (notificationInterval) clearInterval(notificationInterval);
            notificationInterval = setInterval(async () => {
                let lat, lon, city;
                if (isUsingLocation && currentLat) {
                    lat = currentLat; lon = currentLon;
                    city = await getCityNameFromCoords(lat, lon);
                } else if (citySelect.value) {[lat, lon] = cityCoords[citySelect.value];
                    city = citySelect.value;
                }
                
                if (lat && lon) {
                    const wd = await fetchWeatherData(lat, lon, city);
                    await showWeatherNotification(wd.data, wd.city);
                }
            }, 30 * 60 * 1000); 
        }

        function stopNotificationLoop() {
            if (notificationInterval) clearInterval(notificationInterval);
            notificationInterval = null;
        }

        async function showWeatherNotification(data, city) {
            if (!swReg) swReg = await navigator.serviceWorker.ready;
            
            if (swReg && swReg.active) {
                swReg.active.postMessage({
                    type: 'SHOW_WEATHER_NOTIFICATION',
                    payload: {
                        city: city,
                        temp: Math.round(data.current.temperature_2m),
                        desc: getWeatherDesc(data.current.weather_code),
                        iconChar: getWeatherIcon(data.current.weather_code)
                    }
                });
            } else {
                const title = `${getWeatherIcon(data.current.weather_code)} ${city}`;
                new Notification(title, { 
                    body: `${Math.round(data.current.temperature_2m)}°C - ${getWeatherDesc(data.current.weather_code)}\nHissedilen: ${Math.round(data.current.feels_like)}°C`,
                    icon: './logo.png'
                });
            }
        }

        if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); dark = false; }
        citySelect.value = 'İstanbul'; loadWeather();

        async function downloadRegionPng(e, regionIndex) {
            e.stopPropagation();
            const btn = e.currentTarget;
            const region = REGIONS[regionIndex];
            const rows = document.querySelectorAll(`#region-${regionIndex} .bolge-city-row`);
            if (!rows.length) { alert('Veriler henüz yüklenmedi, lütfen bekleyin.'); return; }
            const origText = btn.innerHTML;
            btn.innerHTML = '⏳';
            btn.disabled = true;

            try {
                // DOM'dan şehir verilerini topla
                const cities = [];
                rows.forEach(row => {
                    cities.push({
                        name: row.querySelector('.bcr-name')?.textContent?.trim() || '',
                        desc: row.querySelector('.bcr-desc')?.textContent?.trim() || '',
                        icon: row.querySelector('.bcr-icon')?.textContent?.trim() || '',
                        temp: row.querySelector('.bcr-temp')?.textContent?.trim() || ''
                    });
                });

                // Nunito fontunu canvas için yükle
                try {
                    const nunitoFont = new FontFace('Nunito', 'url(https://fonts.gstatic.com/s/nunito/v26/XRXI3I6Li01BKofiOc5wtlZ2di8HDIkh.woff2)');
                    await nunitoFont.load();
                    document.fonts.add(nunitoFont);
                } catch(e) { /* font yüklenemezse sistem fontu kullanılır */ }

                // Logo
                const logoImg = await new Promise(res => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => res(img);
                    img.onerror = () => res(null);
                    img.src = './logo.png';
                });

                // Tarih
                const now = new Date();
                const gunAdi  = now.toLocaleDateString('tr-TR', { weekday: 'long' });
                const tarihStr = now.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });

                // --- Boyutlar ---
                const SC   = 2;          // retina scale
                const PW   = 420;        // logical px genişlik
                const PADX = 28;
                const ROW_H = 54;
                const HDR_H = 72;
                const DATE_H = 62;
                const DATE_PAD = 14;
                const CARD_W = PW - PADX * 2;
                const CARD_H = HDR_H + cities.length * ROW_H;
                const BOT_H  = 80;       // MuGöl alanı
                const BOT_EXTRA = 18;    // ekstra boşluk (aşağı kaydırma)
                const TOTAL_H = DATE_PAD + DATE_H + DATE_PAD + CARD_H + BOT_H + BOT_EXTRA + DATE_PAD;

                const fc = document.createElement('canvas');
                fc.width  = PW * SC;
                fc.height = TOTAL_H * SC;
                const ctx = fc.getContext('2d');
                ctx.scale(SC, SC);

                // yardımcı: yuvarlatılmış dikdörtgen path
                function rr(x,y,w,h,r){ 
                    ctx.beginPath();
                    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
                    ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
                    ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
                    ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
                    ctx.closePath();
                }

                // ── Arka plan ──
                const bg = ctx.createLinearGradient(0,0,PW*0.3,TOTAL_H);
                bg.addColorStop(0,'#1a3a6b'); bg.addColorStop(0.55,'#0c2a5e'); bg.addColorStop(1,'#061830');
                ctx.fillStyle = bg;
                rr(0,0,PW,TOTAL_H,22); ctx.fill();

                // Üst glow
                const glow = ctx.createRadialGradient(PW*0.8,0,5,PW*0.8,0,PW*0.65);
                glow.addColorStop(0,'rgba(56,189,248,0.18)'); glow.addColorStop(1,'transparent');
                ctx.fillStyle = glow; ctx.fillRect(0,0,PW,TOTAL_H);

                // ── Tarih kutusu ──
                const dateY = DATE_PAD;
                ctx.fillStyle = 'rgba(56,189,248,0.13)';
                rr(PADX, dateY, CARD_W, DATE_H, 14); ctx.fill();
                ctx.strokeStyle = 'rgba(56,189,248,0.30)'; ctx.lineWidth = 1;
                rr(PADX, dateY, CARD_W, DATE_H, 14); ctx.stroke();

                ctx.fillStyle = 'rgba(56,189,248,0.95)';
                ctx.font = `bold 800 17px 'Nunito', sans-serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(tarihStr + '  ' + gunAdi, PW/2, dateY + DATE_H/2);

                // ── Kart ──
                const cardX = PADX;
                const cardY = DATE_PAD + DATE_H + DATE_PAD;

                ctx.fillStyle = 'rgba(14,42,90,0.82)';
                rr(cardX, cardY, CARD_W, CARD_H, 20); ctx.fill();
                ctx.strokeStyle = 'rgba(100,180,255,0.20)'; ctx.lineWidth = 1.2;
                rr(cardX, cardY, CARD_W, CARD_H, 20); ctx.stroke();

                // Kart header
                const BAR_X = cardX + 16;
                ctx.fillStyle = region.color;
                ctx.beginPath(); ctx.roundRect(BAR_X, cardY+16, 4, 40, 3); ctx.fill();

                ctx.fillStyle = '#e8f4ff';
                ctx.font = "900 18px 'Nunito', sans-serif"; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                ctx.fillText(region.name, BAR_X + 14, cardY + 30);
                ctx.fillStyle = 'rgba(126,184,232,0.7)';
                ctx.font = "700 11px 'Nunito', sans-serif";
                ctx.fillText(region.cities.length + ' il · anlık güncelleme', BAR_X + 14, cardY + 52);

                // Rozet
                const bdgW=44, bdgH=22;
                const bdgX=cardX+CARD_W-16-bdgW, bdgY=cardY+HDR_H/2-bdgH/2;
                ctx.fillStyle = region.color+'33'; rr(bdgX,bdgY,bdgW,bdgH,11); ctx.fill();
                ctx.fillStyle = region.color; ctx.font="bold 12px 'Nunito', sans-serif"; ctx.textAlign='center';
                ctx.fillText(region.cities.length+' il', bdgX+bdgW/2, bdgY+bdgH/2);

                // Header alt çizgi
                ctx.strokeStyle='rgba(100,180,255,0.12)'; ctx.lineWidth=1;
                ctx.beginPath(); ctx.moveTo(cardX, cardY+HDR_H); ctx.lineTo(cardX+CARD_W, cardY+HDR_H); ctx.stroke();

                // ── Şehir satırları ──
                cities.forEach((city, i) => {
                    const ry = cardY + HDR_H + i * ROW_H;
                    const midY = ry + ROW_H/2;
                    const isLast = i === cities.length - 1;

                    // Çizgi (şekil değil, sadece ince çizgi)
                    if (!isLast) {
                        ctx.strokeStyle='rgba(100,180,255,0.09)'; ctx.lineWidth=1;
                        ctx.beginPath(); ctx.moveTo(cardX+16,ry+ROW_H); ctx.lineTo(cardX+CARD_W-16,ry+ROW_H); ctx.stroke();
                    }

                    // Şehir adı
                    ctx.fillStyle='#e8f4ff'; ctx.font="800 16px 'Nunito', sans-serif";
                    ctx.textAlign='left'; ctx.textBaseline='middle';
                    ctx.fillText(city.name, cardX+16, midY);

                    // Açıklama
                    const nw = ctx.measureText(city.name).width;
                    ctx.fillStyle='rgba(126,184,232,0.80)'; ctx.font="600 12px 'Nunito', sans-serif";
                    ctx.fillText(city.desc, cardX+16+nw+8, midY);

                    // İkon (emoji - düz, kutusuz)
                    ctx.font='22px sans-serif'; ctx.textAlign='center';
                    ctx.fillText(city.icon, cardX+CARD_W-70, midY);

                    // Sıcaklık
                    ctx.fillStyle='#e8f4ff'; ctx.font="900 17px 'Nunito', sans-serif"; ctx.textAlign='right';
                    ctx.fillText(city.temp, cardX+CARD_W-16, midY);
                });

                // ── Alt: MuGöl (ortalı, aşağıda) ──
                const logoSz = 32;
                const mugolTextW = 60;
                const havaDurW   = 88;
                const totalW = logoSz + 10 + Math.max(mugolTextW, havaDurW);
                const startX = (PW - totalW) / 2;
                const botCY = cardY + CARD_H + BOT_H/2 + BOT_EXTRA;

                if (logoImg) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(startX+logoSz/2, botCY, logoSz/2, 0, Math.PI*2);
                    ctx.closePath(); ctx.clip();
                    ctx.drawImage(logoImg, startX, botCY-logoSz/2, logoSz, logoSz);
                    ctx.restore();
                }

                const txX = startX + logoSz + 10;
                ctx.textBaseline='middle'; ctx.textAlign='left';
                ctx.fillStyle='#e8f4ff'; ctx.font="900 18px 'Nunito', sans-serif";
                ctx.fillText('MuGöl', txX, botCY - 10);
                ctx.fillStyle='rgba(126,184,232,0.85)'; ctx.font="700 13px 'Nunito', sans-serif";
                ctx.fillText('Hava Durumu', txX, botCY + 10);

                // İndir
                const link = document.createElement('a');
                link.download = `${region.name.replace(/ /g,'_')}_hava.png`;
                link.href = fc.toDataURL('image/png');
                link.click();

            } catch(err) { console.error(err); alert('PNG oluşturulamadı: '+err.message); }
            btn.innerHTML = origText;
            btn.disabled = false;
        }
    </script>
</body>
