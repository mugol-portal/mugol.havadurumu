                    if (img) img.src = dataUrl;
                }

                const existingCityModal = document.getElementById('city-png-preview-modal');
                if (existingCityModal) existingCityModal.remove();

                const cModal = document.createElement('div');
                cModal.id = 'city-png-preview-modal';
                cModal.style.cssText = `
                    position:fixed;inset:0;z-index:99999;
                    background:rgba(0,0,0,0.82);backdrop-filter:blur(14px);
                    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
                    padding:20px 16px 24px;overflow-y:auto;
                `;
                cModal.innerHTML = `
                    <div style="width:100%;max-width:420px;">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                            <span style="font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;color:#f0f6ff;letter-spacing:-0.02em;">Önizleme</span>
                            <button id="city-modal-close-btn" style="
                                width:36px;height:36px;border-radius:10px;border:none;
                                background:rgba(255,255,255,0.08);color:#93c5fd;font-size:1.2rem;
                                cursor:pointer;display:flex;align-items:center;justify-content:center;
                                font-family:'Nunito',sans-serif;
                            ">✕</button>
                        </div>

                        <div style="display:flex;gap:10px;margin-bottom:14px;">
                            <button id="city-theme-dark-btn" style="
                                flex:1;padding:10px;border-radius:12px;border:2px solid rgba(96,200,245,0.6);
                                background:rgba(96,200,245,0.12);color:#60c8f5;
                                font-family:'Nunito',sans-serif;font-weight:800;font-size:0.82rem;
                                cursor:pointer;letter-spacing:0.03em;transition:all 0.2s;
                            ">🌙 KOYU TEMA</button>
                            <button id="city-theme-light-btn" style="
                                flex:1;padding:10px;border-radius:12px;border:2px solid rgba(255,255,255,0.15);
                                background:rgba(255,255,255,0.05);color:#94a3b8;
                                font-family:'Nunito',sans-serif;font-weight:800;font-size:0.82rem;
                                cursor:pointer;letter-spacing:0.03em;transition:all 0.2s;
                            ">☀️ AÇIK TEMA</button>
                        </div>

                        <div style="border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);margin-bottom:14px;line-height:0;">
                            <img id="city-png-preview-img" style="width:100%;display:block;" />
                        </div>

                        <button id="city-modal-download-btn" style="
                            width:100%;padding:16px;border-radius:14px;border:none;
                            background:linear-gradient(135deg,#38bdf8,#818cf8);
                            color:#071628;font-family:'Nunito',sans-serif;font-weight:900;
                            font-size:1rem;cursor:pointer;letter-spacing:0.02em;
                            box-shadow:0 8px 24px rgba(56,189,248,0.35);
                        ">⬇ PNG İndir</button>
                    </div>
                `;
                document.body.appendChild(cModal);

                function setCityTheme(t) {
                    cityCurrentTheme = t;
                    const darkBtn = document.getElementById('city-theme-dark-btn');
                    const lightBtn = document.getElementById('city-theme-light-btn');
                    if (t === 'dark') {
                        darkBtn.style.border = '2px solid rgba(96,200,245,0.7)';
                        darkBtn.style.background = 'rgba(96,200,245,0.15)';
                        darkBtn.style.color = '#60c8f5';
                        lightBtn.style.border = '2px solid rgba(255,255,255,0.12)';
                        lightBtn.style.background = 'rgba(255,255,255,0.04)';
                        lightBtn.style.color = '#64748b';
                    } else {
                        lightBtn.style.border = '2px solid rgba(251,191,36,0.7)';
                        lightBtn.style.background = 'rgba(251,191,36,0.12)';
                        lightBtn.style.color = '#fbbf24';
                        darkBtn.style.border = '2px solid rgba(255,255,255,0.12)';
                        darkBtn.style.background = 'rgba(255,255,255,0.04)';
                        darkBtn.style.color = '#64748b';
                    }
                    renderCityPreview();
                }

                document.getElementById('city-theme-dark-btn').onclick = () => setCityTheme('dark');
                document.getElementById('city-theme-light-btn').onclick = () => setCityTheme('light');
                document.getElementById('city-modal-close-btn').onclick = () => cModal.remove();
                cModal.addEventListener('click', (ev) => { if (ev.target === cModal) cModal.remove(); });

                document.getElementById('city-modal-download-btn').onclick = () => {
                    const dataUrl = drawCity(cityCurrentTheme);
                    const link = document.createElement('a');
                    link.download = `${d.city.replace(/ /g,'_')}_hava.png`;
                    link.href = dataUrl;
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    setTimeout(() => { document.body.removeChild(link); cModal.remove(); }, 500);
                };

                renderCityPreview();

            } catch(err) { console.error(err); alert('PNG oluşturulamadı: '+err.message); }
            btn.innerHTML = origText;
            btn.disabled = false;
        }
    </script>
</body>
</html>
